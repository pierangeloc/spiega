name: test

# The suite is the only gate, and it has to run somewhere that is not the
# author's laptop — macOS because that is where this is developed, Linux
# because that is where most people will first try it, and the floor from
# package.json because claiming `engines: node >= 24` without running it there
# is a guess.
#
# Two columns: the floor, and the Active LTS people are moving to. The floor
# is 24 because that is where node runs TypeScript without a loader, which is
# what everything in this toolchain assumes — and tsdown, which cannot run
# below 22.18 at all, would make a lower floor a promise no job here could
# keep. Nothing is tested on 22: it is EOL in April 2027 and the package
# refuses to run on it.
#
# Node is the only runtime any of this may need. pnpm and the build run on
# node, the suite runs on node, and the published artefact runs on node. A
# contributor is welcome to reach for Bun locally; nothing here may come to
# depend on their having done so.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: ubuntu-latest · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite runs against dist/, which `pnpm test` builds first: what is
      # asserted is the package people install, not the tree it came from.
      - run: pnpm test

  # macOS runner queues stall PRs (and occasionally time out before a step
  # starts), while Linux already checks both Node 24 and 26 on every PR. Run
  # macOS on pushes to main so it stays verified without gating every PR.
  suite-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    name: macos-latest · node 26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # POST /op is on the critical path of somebody talking, and the only thing
  # that keeps a write from creeping back onto it is the p99 budget in
  # test/persist.mjs. The suite runs it too; this runs it under its own name,
  # so a draw path that got slower reads as that in the checks list rather
  # than as one more red suite somebody has to open to understand. It is not
  # src/bench.js: that compares models through opencode, costs money and
  # cannot be a gate.
  budget:
    runs-on: ubuntu-latest
    name: POST /op p99 budget
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm vitest run dist/test/persist.spec.mjs

  artefact:
    runs-on: ubuntu-latest
    name: npx from the tarball
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack
      # A clone proves nothing about what npm ships. This installs the tarball
      # somewhere with no checkout in sight, draws on a board over the CLI, and
      # asks the board for its state — the path a first-time user takes.
      - name: draw on a board from the tarball
        run: |
          set -eux
          mkdir -p /tmp/fresh && cd /tmp/fresh
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/spiega-*.tgz
          export SPIEGA_BOARD=ci SPIEGA_PORT=7391
          npx spiega --version
          npx spiega draw '[{"op":"node","id":"gw","kind":"gateway","label":"API Gateway"},{"op":"node","id":"svc","kind":"service","label":"Orders"},{"op":"edge","from":"gw","to":"svc","label":"gRPC"}]'
          npx spiega say 'the gateway forwards to orders'
          # The page is the built React app, one file with its bundle inline:
          # a page that asked the server for a module it no longer serves would
          # render an empty board and say nothing.
          curl -sf http://127.0.0.1:7391/b/ci/ -o /tmp/fresh/page.html
          grep -q '<div id="root"></div>' /tmp/fresh/page.html
          grep -q '<script type="module">' /tmp/fresh/page.html
          if grep -Eq '<script[^>]+src=|<link[^>]+href=|/src/render/' /tmp/fresh/page.html; then exit 1; fi
          # and the route that let a browser read modules off disk is gone
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7391/src/render/render.js)" = 404
          curl -sf http://127.0.0.1:7391/b/ci/state | grep -q 'API Gateway'
          npx spiega snapshot -o /tmp/fresh/board.html
          grep -q '<svg' /tmp/fresh/board.html
          npx spiega stop --all
      # An MCP client starts this process and speaks JSON-RPC over stdin. If it
      # does not answer, an agent simply has no board and is told nothing.
      - name: the MCP server answers
        run: |
          set -eux
          cd /tmp/fresh
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node node_modules/spiega/src/mcp/server.js | tee /tmp/fresh/mcp.out
          grep -q '"name":"board_draw"' /tmp/fresh/mcp.out

  size:
    runs-on: ubuntu-latest
    name: export size
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An export is a file people mail each other, and nothing throws when it
      # gets heavier: a module that pulled in a library would build and pass.
      # This puts the page's weight, raw and gzipped, in the job summary so a
      # regression is a number somebody can read, and fails over the ceiling in
      # tools/size.js.
      - run: pnpm run size

  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser rule, and a job of its own for the same reason typecheck is
      # one: this answers "can the page's modules still run in a browser", which is not
      # the question the suite answers, and a run that cannot tell you which of
      # the two broke is worth less than two runs that can. It needs no build —
      # it reads the source tree, not dist/.
      - run: pnpm run lint

  types:
    runs-on: ubuntu-latest
    name: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Strict, and deliberately a job of its own: every source file is
      # checked with no `any`, no `@ts-ignore` and no loosened flag.
      - run: pnpm run typecheck
