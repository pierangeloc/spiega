name: test

# The suite is the only gate, and it has to run somewhere that is not the
# author's laptop — macOS because that is where this is developed, Linux
# because that is where most people will first try it, and the floor from
# package.json because claiming `engines: node >= 20` without running it there
# is a guess.
#
# Node is the only runtime any of this may need. pnpm and the build run on
# node, the suite runs on node, and the published artefact runs on node. A
# contributor is welcome to reach for Bun locally; nothing here may come to
# depend on their having done so.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite runs against dist/, which `pnpm test` builds first: what is
      # asserted is the package people install, not the tree it came from.
      - run: pnpm test

  artefact:
    runs-on: ubuntu-latest
    name: npx from the tarball
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pack
      # A clone proves nothing about what npm ships. This installs the tarball
      # somewhere with no checkout in sight, draws on a board over the CLI, and
      # asks the board for its state — the path a first-time user takes.
      - name: draw on a board from the tarball
        run: |
          set -eux
          mkdir -p /tmp/fresh && cd /tmp/fresh
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/spiega-*.tgz
          export SPIEGA_BOARD=ci SPIEGA_PORT=7391
          npx spiega --version
          npx spiega draw '[{"op":"node","id":"gw","kind":"gateway","label":"API Gateway"},{"op":"node","id":"svc","kind":"service","label":"Orders"},{"op":"edge","from":"gw","to":"svc","label":"gRPC"}]'
          npx spiega say 'the gateway forwards to orders'
          curl -sf http://127.0.0.1:7391/b/ci/ | grep -q "/src/render/render.js"
          curl -sf http://127.0.0.1:7391/src/render/render.js >/dev/null
          curl -sf http://127.0.0.1:7391/b/ci/state | grep -q 'API Gateway'
          npx spiega snapshot -o /tmp/fresh/board.html
          grep -q '<svg' /tmp/fresh/board.html
          npx spiega stop --all
      # An MCP client starts this process and speaks JSON-RPC over stdin. If it
      # does not answer, an agent simply has no board and is told nothing.
      - name: the MCP server answers
        run: |
          set -eux
          cd /tmp/fresh
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node node_modules/spiega/src/mcp/server.js | tee /tmp/fresh/mcp.out
          grep -q '"name":"board_draw"' /tmp/fresh/mcp.out

  types:
    runs-on: ubuntu-latest
    name: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Strict, and deliberately a job of its own: the modules that have opted
      # in are checked with no `any`, no `@ts-ignore` and no loosened flag.
      - run: pnpm run typecheck
