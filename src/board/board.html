<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spiega</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  :root{
    --paper:#f2efe7; --panel:#f8f6f0; --ink:#231e16; --muted:#857d6e;
    --rule:#ddd6c8; --soft:#ebe6da; --accent:#ef6a4c; --shadow:#41538f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --rail: 310px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:13px/1.55 var(--mono);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .14 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    /* bar, chapter strip, board. One row each, and only the board stretches:
       a pane that is not in this list falls into an implicit auto row, which
       takes the 1fr away from whatever was meant to have it and collapses the
       drawing to the height of its own content. */
    display:grid; grid-template-rows:auto auto 1fr; overflow:hidden;
  }

  /* Each pane in its own row, by name. Auto-placement cannot be trusted here:
     a pane that is `hidden` is not a grid item at all, so the panes below it
     slide up a row — which put the board in the strip's `auto` row and
     collapsed the drawing to the height of its own content every time the
     chapter strip went away. */
  .bar{grid-row:1}
  .chapters{grid-row:2}
  main{grid-row:3}

  /* ---- top bar ---- */
  .bar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--rule)}
  /* the voice picker wears the same clothes as the buttons beside it */
  .pick{font:inherit;max-width:190px;appearance:none;-webkit-appearance:none;
    padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .pick[hidden]{display:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  .dot.idle{background:var(--rule)}
  .dot.down{background:#b3402a;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .bar h1{font-size:14px;font-weight:700;letter-spacing:.04em;margin:0;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* An embedded board can be narrower than the transport. Let the controls
     scroll rather than clipping the last actions off the right edge. */
  @media(max-width:820px){.bar{overflow-x:auto;scrollbar-width:thin}.bar h1{flex:none;max-width:40vw}.bar .spacer{flex:none}}
  .bar .spacer{flex:1}
  .btn{font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    border:1.5px solid var(--ink);border-radius:999px;padding:5px 13px;background:transparent;color:var(--ink);
    cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--soft)}
  .btn:disabled{opacity:.3;cursor:default}
  .btn.on{background:var(--ink);color:var(--paper);box-shadow:2px 2px 0 var(--accent)}
  /* The transport: one place, the three buttons every audio player has, the
     place on the tape, and the speed. It is the whole of the narrator's
     interface — the steps bar below it only walks the flow. */
  .transport{display:flex;align-items:center;gap:6px}
  .transport[hidden]{display:none}
  .btn.icon{padding:5px 10px;display:inline-flex;align-items:center;justify-content:center}
  .btn.icon svg{width:12px;height:12px;display:block;fill:currentColor}
  .btn.rail-button{padding:5px 8px;display:inline-flex;align-items:center;justify-content:center}
  .btn.rail-button svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .transport .pos{font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap;
    min-width:46px;text-align:center}
  .btn.rate{text-transform:none;letter-spacing:.02em;min-width:50px;padding:5px 9px}
  /* The chapters of one explanation. A tab per chapter, in the order they were
     taught, the one being read marked — the whole point of #51 is that the
     parts already explained stay visible, so this strip is the board saying
     they exist. Hidden until there is a second one, since a single tab says
     nothing a title does not. */
  .chapters{display:flex;align-items:stretch;gap:6px;padding:0 18px;border-bottom:1px solid var(--rule);
    overflow-x:auto;scrollbar-width:none}
  .chapters[hidden]{display:none}
  .chapters::-webkit-scrollbar{display:none}
  .chapters button{font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);
    padding:9px 4px;margin-right:8px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .chapters button:hover{color:var(--ink)}
  .chapters button.here{color:var(--ink);border-bottom-color:var(--accent)}
  .chapters .num{font-size:10px;color:var(--muted);font-weight:400}
  /* The map is a tab about the whole explanation, sitting among tabs about
     its parts; the rule keeps it from reading as chapter zero. */
  .chapters button.maptab{border-right:1px solid var(--rule);padding-right:14px;margin-right:14px}
  .chapters button.here .num{color:var(--accent)}
  /* A chapter moved while you were reading a different one — the live one
     being drawn on, or an earlier one the agent went back and added to. Not a
     number and not a jump: a mark that something happened where you are not. */
  .chapters .growing{width:7px;height:7px;border-radius:50%;background:var(--accent);
    animation:pulse 1.4s ease-in-out infinite}

  /* ---- the two panes ---- */
  main{display:grid;grid-template-columns:var(--rail) 1fr;min-height:0;position:relative}
  main.norail{grid-template-columns:0 1fr}
  /* In a split pane the rail would eat the board, so below this width it
     becomes a drawer over the drawing instead of a column beside it. */
  @media (max-width:820px){
    main{grid-template-columns:0 1fr}
    .rail{position:absolute;inset:0 auto 0 0;width:min(300px,78vw);z-index:5;
      background:var(--paper);box-shadow:6px 0 0 rgba(35,30,22,.06)}
    main.norail .rail{display:none}
    main:not(.norail) .rail{display:flex}
  }

  /* ---- transcript rail: what was said while it was drawn ---- */
  .rail{grid-column:1;border-right:1px solid var(--rule);overflow-y:auto;padding:16px 14px 40px;display:flex;
    flex-direction:column;gap:9px;min-width:0}
  main.norail .rail{display:none}
  /* `backwards`, not `forwards`: a fill-forwards animation keeps owning opacity
     after it ends and would outrank .off below, so a dimmed line would stay
     bright. The keyframe holds the pre-start state instead. */
  /* overflow-wrap:anywhere, because what gets said about software is full of
     things longer than the rail is wide — a type name, a URL, a column. Left
     to itself such a word runs out of its card and under the drawing, and the
     end of it is simply gone. Broken mid-word it is at least all there. */
  .said{background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;padding:9px 12px;
    font-size:12.5px;line-height:1.5;box-shadow:3px 3px 0 var(--soft);
    overflow-wrap:anywhere;animation:in .32s ease backwards}
  .said.latest{box-shadow:3px 3px 0 var(--accent)}
  /* Stepping the flow lights the drawing; the script has to follow, or the
     reader is left matching sentence to picture by hand. A line that belongs
     to another step recedes rather than disappearing — the shape of the whole
     explanation stays readable — and a line tied to no step never dims. */
  .said.on{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent);background:var(--paper)}
  .said.on .tag{color:var(--accent)}
  .said.off{opacity:.42;box-shadow:3px 3px 0 var(--soft);filter:saturate(.55)}
  /* only the lines that lead somewhere look like they do */
  /* The word being spoken. A background rather than a colour change, because
     a colour change on one word in a paragraph is hard to catch at a glance
     and the whole point is to be followable without looking for it. */
  .said .w.lit,.mapcard .w.lit,.map .lede .w.lit{background:var(--accent);color:var(--paper);
    border-radius:3px;box-shadow:0 0 0 2px var(--accent)}
  .said.saying{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}
  /* The rail is the scrub bar. A dot beside each line, in the margin it
     already has, says where the tape has been and where it is going: filled
     for what has been read, ringed for what is coming, large for the line
     being read. Clicking any of them starts the tape there — which it always
     did; this is the part that says so. Only once the tape has started: a rail
     of "all of this is ahead" on a board nobody has played is noise. */
  .rail.scrub .said{position:relative}
  .rail.scrub .said::before{content:"";position:absolute;left:-11px;top:50%;width:7px;height:7px;
    margin-top:-3.5px;border-radius:50%;box-sizing:border-box;background:var(--paper);
    border:1.5px solid var(--muted);transition:background .2s ease,border-color .2s ease,transform .2s ease}
  .rail.scrub .said.heard::before{background:var(--ink);border-color:var(--ink)}
  .rail.scrub .said.saying::before{background:var(--accent);border-color:var(--accent);transform:scale(1.5)}
  .said.go{cursor:pointer}
  .said{cursor:pointer}
  .said.go:hover{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent);transform:translateY(-1px)}
  .said.go:hover .tag{color:var(--accent)}
  .said.go:active{transform:translateY(0);box-shadow:2px 2px 0 var(--accent)}
  .said.go.on:hover{box-shadow:4px 4px 0 var(--accent)}
  .said{transition:opacity .28s ease, border-color .28s ease, box-shadow .28s ease, filter .28s ease}
  .said .tag{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-bottom:3px}
  /* A phase of the explanation, over the run of lines about it. Written as a
     heading with a rule running off it rather than as another card, because a
     card would read as one more thing that was said. */
  .phase{display:flex;align-items:center;gap:8px;margin:7px 0 -2px;
    font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .phase:first-child{margin-top:0}
  .phase::after{content:"";flex:1;height:1.5px;background:var(--rule)}
  .said b{font-weight:700}
  .said code{background:var(--soft);padding:1px 4px;border-radius:4px;font-size:11.5px}
  .rail .empty{color:var(--muted);font-size:12px;padding:6px 2px}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ---- the board ---- */
  .stage{grid-column:2;position:relative;overflow:hidden;min-width:0;cursor:grab;-webkit-user-select:none;user-select:none}
  .stage.drag{cursor:grabbing}
  /* A box that some step lights is a way into that step, and says so with the
     cursor. A box no step touches is not clickable and does not pretend to be
     — the same rule the rail follows for a line tied to no step. The class is
     set after every render, because a step can arrive later and put a box
     into the flow that was not in it before. */
  .pan g[data-node].go{cursor:pointer}
  .stage.drag .pan g[data-node].go{cursor:grabbing}
  /* user-select is inherited, so the rule above reaches everything laid over
     the board too. Those are text somebody has to be able to copy: the command
     the empty board shows, and the reason a board is not being saved. */
  .blank code,.warnings,.caption,.steps{-webkit-user-select:text;user-select:text}
  .pan{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .pan svg{display:block}
  .pan text{font-family:var(--mono)}
  /* grain over the drawing, as an overlay rather than an SVG filter: the board
     redraws while it animates, and a filter would be recomputed every frame */
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.42;
    background-size:180px 180px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .18  0 0 0 0 .15  0 0 0 0 .11  .5 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23g)' opacity='.55'/></svg>")}

  .blank[hidden]{display:none}
  .blank{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;color:var(--muted)}
  .blank .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .blank code{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:3px 7px;font-size:11.5px}

  /* ---- step strip ---- */
  .steps{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
    padding:11px 16px;background:color-mix(in srgb, var(--panel) 88%, transparent);
    border-top:1px solid var(--rule);backdrop-filter:blur(3px)}
  .steps[hidden]{display:none}
  .steps .n{font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
  .steps .txt{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The line being said, over the drawing. The rail is collapsed in a narrow
     pane and scrolled away in a wide one, so during a replay the words have to
     come to the picture. */
  .caption{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:4;max-width:min(680px,88%);
    overflow-wrap:anywhere;
    background:var(--ink);color:var(--paper);border-radius:13px;padding:10px 16px;font-size:14px;line-height:1.5;
    box-shadow:4px 4px 0 rgba(35,30,22,.18);text-align:center;opacity:0;transition:opacity .3s}
  .caption[hidden]{display:none}
  .caption.on{opacity:1}
  .caption b{color:var(--accent)}
  /* A failed handover must stay in the viewport even when the toolbar makes
     the board wider than a narrow pane. Ordinary replay captions follow it. */
  .caption.problem{position:fixed;left:50vw;max-width:min(680px,88vw)}
  .warnings{position:absolute;left:0;right:0;top:0;z-index:6}
  /* flex-wrap, because a board is often a narrow split pane and the sentence
     that matters is the second half of this one. Without it the warning reads
     "nothing drawn h" and the reader loses the only part worth printing. */
  .offline{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;
    justify-content:center;text-align:center;padding:7px 14px;background:#b3402a;
    color:var(--paper);font-size:11.5px}
  .offline[hidden]{display:none}
  .offline .k{text-transform:uppercase;letter-spacing:.12em;font-weight:700;flex:none}
  /* min-width:0 is the whole fix. A flex item defaults to min-width:auto, so
     the sentence refused to shrink below its own length and ran off the edge
     instead of breaking — flex-wrap alone does nothing, because there is only
     one item to wrap. */
  .offline .msg{min-width:0;flex:0 1 auto;overflow-wrap:anywhere}
  /* Not red: being disconnected means this board may be stale, which a
     reconnect fixes. Not being saved means the session is going to be lost,
     which nothing here fixes. Two different alarms deserve two colours. */
  .unsaved{background:#9a6a15}
  /* The controls that act on the drawing, laid over the drawing (#126).

     The bar is about the explanation — what is being said, where the tape is
     up to, which chapter. `fit`, `follow` and the exports are about the
     picture, and they were the ones falling off the right edge in a split
     pane. Moving them is better than ranking and hiding them: a hidden button
     on a laptop is as gone as one off the edge, and a relocated one is gone
     from nowhere.

     Top right, not bottom: the step cards own the bottom edge at full width
     and the narration caption sits just above them, while a board is drawn
     from the top left. This is the corner that stays empty on nearly every
     board. */
  .tools{position:absolute;right:14px;top:12px;z-index:5;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  .tool{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb, var(--panel) 86%, transparent);backdrop-filter:blur(3px)}
  .tool svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  /* The two exports are one button and a choice, because an icon can carry
     "export" and cannot carry "export which". The sheet opens to the left:
     there is no room to its right, and the stage below it is the drawing. */
  .menu{position:relative}
  .menu .sheet{position:absolute;top:0;right:38px;display:none;flex-direction:column;gap:4px;
    background:var(--panel);border:1.5px solid var(--ink);border-radius:13px;padding:6px;
    box-shadow:4px 4px 0 rgba(35,30,22,.18)}
  .menu.open .sheet{display:flex}
  .menu .sheet .btn{border:none;padding:5px 11px;text-align:right}

  /* ---- the map: the explanation from above ----
     A tab strip says a board has four chapters and nothing about how they
     hang together. The map is the other half of that: a card per chapter, in
     the order they were taught, with a line between the ones that turn out to
     be about the same box. It lies over both panes, because it is not a view
     of a chapter — it is the way back out of one. */
  /* `max-width:100vw` because the top bar does not shrink: in a narrow pane
     it makes `main` wider than the window, and cards that wrapped to that
     width would run off the side of a split pane with no way back. */
  .map{position:absolute;inset:0;z-index:7;background:var(--paper);overflow:auto;
    max-width:100vw;padding:20px 24px 44px;transition:opacity .22s ease}
  .map[hidden]{display:none}
  .map.leaving{opacity:0;overflow:hidden;pointer-events:none}
  .map .lede{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:0 0 18px}
  .mapwrap{position:relative}
  /* The links are drawn under the cards and must not swallow a click meant
     for one; overflow stays visible so a bow above the top row is not cut. */
  .maplinks{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  /* The gutter is sized for what hangs in it: the pill naming the box two
     chapters share. Narrower than this and the name lies across the cards it
     is pointing between. */
  .cards{position:relative;display:flex;flex-wrap:wrap;gap:92px;align-items:flex-start;padding-top:8px}
  /* Room for the bows: a chapter linked to one two along arcs over the cards
     in between, and with the row flush to the top of the pane that arc is
     drawn off the page. Only when there is such a link — in one column there
     never is, and the gap would be a hole at the top of a narrow pane. */
  .cards.bowed{padding-top:108px}
  .mapcard{font:inherit;text-align:left;color:var(--ink);background:var(--panel);
    border:1.5px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--soft);
    padding:0;width:278px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, opacity .22s ease}
  .mapcard:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:5px 5px 0 var(--accent)}
  .mapcard .head{display:flex;align-items:baseline;gap:8px;padding:10px 12px 8px}
  .mapcard .n{font-size:10px;color:var(--muted);font-weight:400;flex:none}
  .mapcard .t{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The chapter's own drawing, shrunk. The point of the map is that you
     recognise the picture you are about to open, so this is the real render
     rather than an icon standing in for one. */
  .mapcard .thumb{height:142px;background:var(--paper);border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);display:grid;place-items:center;padding:8px}
  .mapcard .thumb svg{width:100%;height:100%;max-height:126px}
  .mapcard .thumb .nothing{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .mapcard .line{font-size:12px;line-height:1.45;padding:9px 12px 0;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .mapcard .meta{font-size:10.5px;color:var(--muted);letter-spacing:.06em;padding:8px 12px 10px;margin-top:auto}
  .mapcard.here{box-shadow:3px 3px 0 var(--accent);border-color:var(--accent)}
  /* The card being described while the outline is read. It opens up so the
     whole of its line can be lit, not only the first three rows of it. */
  .mapcard.speaking{box-shadow:5px 5px 0 var(--accent);border-color:var(--accent)}
  /* Playback wraps each word in a span. In a -webkit-box line clamp, Chrome
     drops the whitespace text nodes between those spans, joining the words. */
  .mapcard.speaking .line{display:block;-webkit-line-clamp:none}
  .mapcard.islive .n::after{content:" \25CF";color:var(--accent)}
  /* Opening a chapter: the card you clicked grows into the board behind it
     while the rest get out of the way, so the tab that comes up is visibly
     the thing you pointed at. */
  .map.leaving .mapcard{opacity:0}
  .map.leaving .mapcard.going{opacity:1;transform:scale(1.35);border-color:var(--accent)}
  /* The pill lives in the gutter and stays there: a box named like a table is
     wider than the gap between two cards, so it wraps rather than lying across
     the pictures it is pointing between. Hence the soft rectangle — a pill
     shape only reads as one on a single line. */
  .maplabel{position:absolute;transform:translate(-50%,-50%);background:var(--panel);
    border:1.25px solid var(--ink);border-radius:9px;padding:2px 6px;font-size:9px;
    letter-spacing:.02em;line-height:1.3;text-align:center;max-width:84px;
    overflow-wrap:anywhere;pointer-events:none}
  .maplabel.free{max-width:200px}
  .maplabel.then{border-style:dashed;color:var(--muted);border-color:var(--rule);background:var(--paper)}
</style>
</head>
<body>
  <div class="bar">
    <span class="dot idle" id="live" title="waiting for the agent"></span>
    <h1 id="title">spiega</h1>
    <span class="spacer"></span>
    <button class="btn rail-button" id="rail-toggle" title="show or hide transcript" aria-label="hide transcript" aria-controls="rail" aria-expanded="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="14" rx="2"/><path d="M6 7h8M6 10h8M6 13h5"/></svg></button>
    <div class="transport" id="transport" role="group" aria-label="narration">
      <button class="btn icon" id="tprev" title="previous line (↑)" aria-label="previous line" disabled><svg viewBox="0 0 12 12"><rect x="1" y="1.5" width="2" height="9"/><path d="M11 1.5v9L4.5 6z"/></svg></button>
      <button class="btn icon" id="narrate" title="read the script aloud — space plays and pauses" aria-label="play"></button>
      <button class="btn icon" id="tnext" title="next line (↓)" aria-label="next line" disabled><svg viewBox="0 0 12 12"><rect x="9" y="1.5" width="2" height="9"/><path d="M1 1.5v9L7.5 6z"/></svg></button>
      <span class="pos" id="tpos" title="where the tape is up to"></span>
      <button class="btn rate" id="rate" title="speed — each change restarts the sentence being read">1×</button>
    </div>
    <select class="btn pick" id="voicepick" title="which voice reads it — choosing one speaks a sample"></select>
    <button class="btn" id="replay" title="play the session back as it happened">replay</button>
  </div>

  <nav class="chapters" id="chapters" hidden></nav>

  <main id="main">
    <aside class="rail" id="rail"><div class="empty">Nothing said yet.</div></aside>
    <div class="stage" id="stage">
      <div class="pan" id="pan"></div>
    <div class="tools" id="tools">
      <button class="btn tool" id="fit" title="fit the whole board in view (f)" aria-label="fit the whole board in view"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
      <button class="btn tool" id="follow" title="keep the lit boxes in view while walking the flow" aria-label="follow the flow" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v2.4M8 12.6V15M1 8h2.4M12.6 8H15"/></svg></button>
      <div class="menu" id="exports">
        <button class="btn tool" id="snap" title="download this board as one interactive file" aria-label="export this board" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v7.2M5 6.4 8 9.6l3-3.2M3 11v2.2h10V11"/></svg></button>
        <div class="sheet">
          <button class="btn" id="snap-all">whole board</button>
          <button class="btn" id="snap-chapter">this chapter</button>
        </div>
      </div>
    </div>
      <div class="blank" id="blank">
        <div class="k">the board is empty</div>
        <div><code>spiega draw '{"op":"node","label":"API Gateway","kind":"gateway"}'</code></div>
      </div>
      <div class="warnings">
        <div class="offline" id="offline" hidden>
          <span class="k">not connected</span>
          <span class="msg">this board may be out of date &mdash; reconnecting&hellip;</span>
        </div>
        <div class="offline unsaved" id="unsaved" hidden>
          <span class="k">not being saved</span>
          <span class="msg" id="unsavedwhy"></span>
        </div>
      </div>
      <div class="caption" id="caption" hidden></div>
      <div class="steps" id="steps" hidden>
        <button class="btn" id="prev">&larr;</button>
        <span class="n" id="stepn"></span>
        <span class="txt" id="steptxt"></span>
        <button class="btn" id="play">play</button>
        <button class="btn" id="next">&rarr;</button>
      </div>
    </div>
    <div class="map" id="map" hidden>
      <p class="lede" id="maplede"></p>
      <div class="mapwrap" id="mapwrap">
        <svg class="maplinks" id="maplinks"></svg>
        <div class="cards" id="mapcards"></div>
      </div>
    </div>
  </main>

<script type="module">
import { renderSVG } from '/src/render/render.js';
import { animateIn, seedOf } from '/src/board/draw-on.js';
import { emptyBoard, applyOps } from '/src/board/state.js';
import { lineStates, groupRuns, clickStep, clickNode } from '/src/board/script.js';
import { createNarrator, wrapWords, wordAt } from '/src/board/narrate.js';
import { tapeOf, worthAnOutline, ledeText, locate, railMarks, nextRate, rateLabel } from '/src/board/tape.js';
import { frame, unionBox, litKeys } from '/src/board/camera.js';
import { boardMap, linkLabel } from '/src/board/map.js';
import { roughLine, stroke, arrowHead, hashSeed } from '/src/render/ink.js';

const $ = id => document.getElementById(id);

/* One server holds every board, each under /b/<name>/, so this page's own path
   is its api root. Normalise the trailing slash first: /b/demo and /b/demo/ are
   the same board, and the page must read both the same rather than depending on
   the server to redirect one into the other. A url without the slash would
   otherwise have its board name stripped too, and every fetch would quietly go
   to /b/ — a board that is not this one, and no error to show for it. Taken from
   the location rather than from a name baked into the html, because the same
   file serves every board. The renderer above is imported from /src/ instead:
   one copy, shared by all of them. */
const API = location.pathname.replace(/\/?$/, '/');
const exported = window.__SPIEGA_EXPORT__ || null;

// which board this page is, as the server knows it — shown in the window title
let boardTag = '';
if (!exported) fetch(API + 'whoami').then(r => r.json()).then(w => { boardTag = w.name || ''; }).catch(() => {});
const pan = $('pan'), stage = $('stage');

let board = null;      // the live board
let shown = null;      // what is on screen — the live board, or a replay of it
let lastBoxes = {};
let lastOffset = { x: 0, y: 0 };
let lastActive;                 // the step the camera last framed
const MARGIN = 18;

/* ---------- chapters ----------

   One explanation, several surfaces. The chapter being drawn on lives on the
   board itself; the ones already finished sit in `board.chapters`, whole, and
   reading one is a matter of handing the renderer that surface instead.

   Reading an earlier chapter is a *view*, not a board state: walking its steps
   must not post anything, because the agent may well be drawing on the live
   chapter while someone reads chapter one, and a reader should not be able to
   move what the explainer is standing at. So the step lives here. */
let viewing = null;             // index into board.chapters, or null for the live chapter
let chapterStep = null;         // the step a reader is walking in a finished chapter
/* Chapters that moved while someone was reading a different one. Keyed the way
   `viewing` is — an index, or null for the live chapter — because that is the
   question being asked: did this change while I was not looking at it. */
let changed = new Set();

let replayAt = null;            // a chapter a replay has stepped back into

const view_of = () => {
  if (shown) {
    const back = replayAt == null ? null : shown.chapters?.[replayAt];
    return back ? { ...back, active: null } : shown;
  }
  const ch = viewing == null ? null : board?.chapters?.[viewing];
  return ch ? { ...ch, active: chapterStep } : board;
};

/* One set of already-drawn keys per surface, so each chapter remembers what
   it has on it.

   Two things need that memory. A replay that steps back into chapter one must
   not redraw the whole of chapter four when it returns. And a reader moving
   between tabs is navigating, not watching an explanation: a chapter already
   seen should simply be there, where it was, rather than drawing itself again
   every time its tab is clicked. What they have not seen still draws on —
   a chapter opened for the first time, or the boxes an amendment added while
   they were reading somewhere else. */
const inked = new Map();
const inkFor = key => {
  if (!inked.has(key)) inked.set(key, new Set());
  return inked.get(key);
};
// the key for a surface: the live chapter, or a finished one by its index
const inkKey = i => (i == null ? 'live' : `ch${i}`);
let drawn = inkFor('live');     // the ink of the surface on screen, so each key animates once
let view = { x: 0, y: 0, k: 1 };
let userMoved = false;
let playing = null;

/* ---------- drawing a new group on, stroke by stroke ---------- */

/* ---------- render ---------- */

function render(fresh = null) {
  const board = view_of();
  if (!board) return;
  const empty = !board.nodes.length;
  // during a replay an empty board is the opening frame, not an invitation
  $('blank').hidden = !empty || replaying;
  if (empty) { pan.innerHTML = ''; drawn.clear(); return; }

  const r = renderSVG(board, { margin: MARGIN, active: board.active, hand: false });
  pan.innerHTML = r.svg;
  pan.dataset.w = r.width; pan.dataset.h = r.height;
  lastBoxes = r.boxes; lastOffset = r.offset;

  /* Which boxes lead somewhere. A step lights both ends of its edge, so most
     boxes on a board with a flow are in it — and a box that is in it is a way
     into the steps that light it, and wears the cursor of one. The class is
     set here rather than in the drawing because the renderer knows nothing
     about the gesture. */
  const leads = new Set();
  (board.flow || []).forEach(s => litKeys(s).forEach(k => leads.add(k)));
  pan.querySelectorAll('g[data-node]').forEach(g => {
    g.classList.toggle('go', leads.has(g.dataset.node));
  });

  // Anything whose key is new gets drawn on; everything else is simply there.
  // Stagger order is boxes, then enclosures, then the lines between them —
  // the order a person draws in. Lines first would point at empty paper.
  const rank = { node: 0, boundary: 1, edge: 2 };
  const groups = [...pan.querySelectorAll('[data-node],[data-boundary],[data-edge]')]
    .map(g => ({ g, kind: g.dataset.node ? 'node' : g.dataset.boundary ? 'boundary' : 'edge' }))
    .sort((a, b) => rank[a.kind] - rank[b.kind]);
  // How fast the hand works depends on how much arrived. One box while someone
  // is talking gets drawn deliberately; a whole spec landing at once is laid
  // down briskly, because nobody wants to watch nine boxes drawn in sequence.
  const pending = groups.filter(({ g }) =>
    !drawn.has(g.dataset.node || g.dataset.boundary || g.dataset.edge));
  const pace = pending.length > 6 ? 0.22 : pending.length > 2 ? 0.38 : 0.6;
  let clock = 0;
  for (const { g } of pending) {
    const key = g.dataset.node || g.dataset.boundary || g.dataset.edge;
    const dur = animateIn(g, clock, seedOf(key));
    clock += Math.min(dur * pace, 480);
    drawn.add(key);
  }
  const n = pending.length;
  if (!userMoved && !replaying) fit(groups.length > 0 && n > 0);
  return clock;
}

function fit(smooth = false) {
  const W = +pan.dataset.w || 1, H = +pan.dataset.h || 1;
  const aw = stage.clientWidth - 32, ah = stage.clientHeight - (view_of()?.flow?.length ? 86 : 32);
  // The stage can report zero size mid-layout — in a split pane that is resizing,
  // or before the first paint. Fitting to that yields a negative scale that
  // sticks, so skip and let the ResizeObserver below try again.
  if (aw < 40 || ah < 40) return;
  const k = Math.max(0.05, Math.min(1.25, aw / W, ah / H));
  view = { k, x: (stage.clientWidth - W * k) / 2, y: Math.max(12, (ah - H * k) / 2) };
  pan.style.transition = smooth ? 'transform .45s cubic-bezier(.3,.7,.3,1)' : 'none';
  applyView();
}

const applyView = () => { pan.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; };

/* ---------- transcript ---------- */

const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');

const mdish = s => s
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

function renderRail() {
  const rail = $('rail');
  const board = view_of();
  const t = board?.transcript || [];
  if (!t.length) {
    if (!rail.querySelector('.empty')) rail.innerHTML = '<div class="empty">Nothing said yet.</div>';
    loadTape();                 // a chapter with nothing said has an empty tape, not the last one's
    return;
  }

  /* Append-only. A step change restyles the lines that are already there and
     touches nothing else: rebuilding the rail's HTML would restart every
     line's fade-in, so pressing through 1/6 … 6/6 would make the whole script
     flicker each time. Lines only ever arrive at the end, except on a replay,
     which starts from none. */
  let nodes = [...rail.querySelectorAll('.said')];
  if (nodes.length > t.length) { rail.innerHTML = ''; nodes = []; }
  if (!nodes.length) rail.innerHTML = '';
  for (let i = nodes.length; i < t.length; i++) {
    const d = document.createElement('div');
    d.dataset.line = i;
    rail.appendChild(d);
    nodes.push(d);
  }

  // which line goes with which step, and how it should look — board/script.js
  const states = lineStates(board);

  t.forEach((e, i) => {
    const node = nodes[i], { step, state } = states[i];
    const cls = ['said'];
    if (i === t.length - 1) cls.push('latest');
    if (state !== 'idle') cls.push(state);
    // A line that names a step is a way into that step: the reader has just
    // read the words, and the hop they are about is one click away.
    if (step != null) cls.push('go');
    node.className = cls.join(' ');
    if (step == null) delete node.dataset.step; else node.dataset.step = String(step);
    node.title = step == null ? '' : `step ${step + 1} \u2014 click to walk it`;
    const tag = step == null ? '' : `<span class="tag">step ${step + 1}</span>`;
    const html = tag + `<span class="said-body">${mdish(e.text)}</span>`;
    if (node.dataset.html !== html) {
      node.innerHTML = html;
      node.dataset.html = html;
      /* Every word gets its own span, numbered by where it starts. The
         narrator speaks this element's textContent, so an offset reported by
         the synthesiser maps straight onto one of these. */
      wrapWords(node.querySelector('.said-body'));
    }
  });

  /* The phases, as headers over the runs of lines they cover — board/script.js
     works out where each run starts and stops.

     Rebuilt every time, where the lines are not: a run changes shape whenever
     a line lands or a tag moves, and there is no append-only way to say "a
     header now belongs three lines further up". Taking the headers out and
     putting them back costs nothing a reader can see, because the headers are
     not the elements carrying the fade-in. */
  rail.querySelectorAll('.phase').forEach(h => h.remove());
  for (const run of groupRuns(board)) {
    const h = document.createElement('div');
    h.className = 'phase';
    h.dataset.group = run.id;
    h.innerHTML = `<span>${mdish(run.label)}</span>`;
    rail.insertBefore(h, nodes[run.from]);
  }

  loadTape();

  /* Follow the step, not the tail: while a step is lit, its own lines are what
     the reader needs on screen, and in a long session they are far above the
     bottom. With no step, the newest line is the interesting one. */
  const lit = rail.querySelector('.said.on');
  if (lit) {
    const top = lit.offsetTop - rail.clientHeight / 2 + lit.offsetHeight / 2;
    rail.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  } else {
    rail.scrollTop = rail.scrollHeight;
  }
}

/* ---------- flow ---------- */

function renderSteps() {
  const board = view_of();
  const f = board?.flow || [];
  $('steps').hidden = !f.length;
  if (!f.length) return;
  const i = board.active;
  $('stepn').textContent = i == null ? `${f.length} steps` : `${i + 1}/${f.length}`;
  $('steptxt').textContent = i == null ? 'press → to walk the flow' : (f[i].step || f[i].edge || '');
  // The strip is one line and ellipsises: the whole of a long step is here.
  $('steptxt').title = $('steptxt').textContent;
  $('prev').disabled = i == null || i <= 0;
  $('next').disabled = i != null && i >= f.length - 1;
}

/* Walking a step. On the live chapter it is a board state, so it is posted and
   comes back down the stream to every window; in a finished chapter it is one
   reader's place in something nobody is drawing on any more. */
const focus = step => {
  if (viewing == null) return post([{ op: 'focus', step }]);
  chapterStep = step;
  renderRail(); render(); renderSteps(); frameStep();
};

/* ---------- the chapter strip ---------- */

/* Every surface of this explanation, the finished ones and the live one last,
   in the order they were taught. */
const surfaces = () => [...(board?.chapters || []).map((c, i) => ({ c, i })), { c: null, i: null }];

function renderChapters() {
  const strip = $('chapters');
  const all = surfaces();
  // one surface is not a chaptered explanation, it is a board
  strip.hidden = all.length < 2;
  if (strip.hidden) { strip.innerHTML = ''; return; }
  strip.innerHTML = '';
  /* The map rides at the head of the strip, where a contents page goes. It
     is the one tab that is about the explanation rather than about a part of
     it, so it keeps its place while the chapters pile up to the right of it. */
  const m = document.createElement('button');
  m.className = (mapOpen ? 'here ' : '') + 'tab maptab';
  m.innerHTML = '<span class="num">⊞</span><span>map</span>';
  m.title = 'all the chapters at once, and what they have in common';
  m.onclick = () => { if (!replaying) showMap(); };
  strip.appendChild(m);

  /* Which tab is the one being looked at, counting the live chapter last. A
     replay says so too: it walks the chapters itself, and a strip that went
     blank for the length of the movie would hide the structure exactly while
     the movie was explaining it. */
  const here = replaying
    ? (replayAt != null ? replayAt : (shown?.chapters?.length ?? 0))
    : mapOpen ? -1                     // the reader is above the chapters, in none of them
      : (viewing == null ? all.length - 1 : viewing);
  for (const { c, i } of all) {
    const b = document.createElement('button');
    const live = i == null;
    const at = i == null ? all.length - 1 : i;
    const title = (live ? board?.chapter : c.title) || 'untitled';
    b.className = (at === here ? 'here ' : '') + 'tab';
    const marked = !replaying && changed.has(i);
    b.innerHTML = `<span class="num">${(i == null ? all.length : i + 1)}</span>` +
      `<span>${title.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>` +
      (marked ? '<span class="growing"></span>' : '');
    b.title = live ? 'the chapter being drawn now'
      : marked ? `chapter ${i + 1} — something was added to it` : `chapter ${i + 1}`;
    // a replay owns the screen while it runs, and it is walking these itself
    b.onclick = () => { if (!replaying) showChapter(i); };
    strip.appendChild(b);
    /* In a split pane the strip scrolls, and the chapter being read is the one
       that has to be on screen — otherwise the tab that says where you are is
       the one you cannot see. */
    if (at === here) requestAnimationFrame(() => b.scrollIntoView({ block: 'nearest', inline: 'nearest' }));
  }
}

/* ---------- the map ----------

   Chapters arrived as tabs, and tabs are a list: they say there are four
   parts and nothing about how the parts hang together, which leaves anyone
   who did not watch the board being drawn reading four unrelated pictures in
   a row. The map is the missing sentence. It is the first tab, it shows each
   chapter as its own drawing shrunk down, and it joins the chapters that are
   about the same box — read off what was drawn, since nobody declares it.

   It is a layer over both panes rather than a surface the renderer is handed:
   a map is not a chapter, it is the way back out of one, and giving it to
   `view_of` would have the camera, the rail, the flow strip and the narrator
   all trying to make sense of a board that is not a board. */
let mapOpen = false;

/* A finished chapter's picture does not change unless it is amended, and
   re-rendering five of them on every op that lands on the live one is work
   nobody asked for. Keyed on what would make the picture different. */
const thumbs = new Map();
function thumbOf(key, surface) {
  const sig = `${surface.nodes.length}:${surface.edges.length}:${surface.boundaries?.length || 0}:${surface.settled}`;
  const had = thumbs.get(key);
  if (had?.sig === sig) return had.svg;
  const svg = surface.nodes.length
    ? renderSVG({ ...surface, active: null }, { margin: 10, active: null, hand: false }).svg
    : '<div class="nothing">nothing drawn yet</div>';
  thumbs.set(key, { sig, svg });
  return svg;
}

function renderMap() {
  if (!mapOpen) return;
  const { cards, links } = boardMap(board);
  const wrap = $('mapcards');
  $('maplede').textContent = ledeText(board?.title, cards.length);
  wrap.innerHTML = '';
  for (const c of cards) {
    const surface = c.live ? board : board.chapters[c.i];
    const el = document.createElement('button');
    el.className = 'mapcard' + (c.live ? ' islive' : '') + (c.i === viewing ? ' here' : '');
    el.dataset.n = String(c.n);
    el.title = c.live ? 'the chapter being drawn now — click to open it'
      : `chapter ${c.n} — click to open it`;
    const bits = [`${c.nodes} boxes`, `${c.edges} lines`];
    if (c.steps) bits.push(`${c.steps} steps`);
    el.innerHTML =
      `<span class="head"><span class="n">${c.n}</span><span class="t">${esc(c.title)}</span></span>` +
      `<span class="thumb">${thumbOf(c.live ? 'live' : `ch${c.i}`, surface)}</span>` +
      (c.line ? `<span class="line">${mdish(c.line)}</span>` : '') +
      `<span class="meta">${bits.join(' · ')}</span>`;
    el.onclick = () => enterChapter(c.i, el);
    wrap.appendChild(el);
  }
  // the links need the cards laid out before they can know where to go
  requestAnimationFrame(() => drawLinks(links));
  /* The cards were just rebuilt, and the one being described was among them:
     the tape is handed over again so the lit card is lit again. */
  loadTape();
}

/* The lines between the cards, in the board's own ink — this is a drawing of
   an explanation, and a map drawn in a different hand would read as chrome. */
function drawLinks(links) {
  const wrap = $('mapwrap'), cards = $('mapcards'), svg = $('maplinks');
  [...wrap.querySelectorAll('.maplabel')].forEach(n => n.remove());
  const box = n => {
    const el = cards.querySelector(`.mapcard[data-n="${n}"]`);
    return el && { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
  };
  /* Whether anything bows over the top, which decides how much room there is
     up there. Changing it moves every card, so the lines are drawn on the
     next frame against where the cards ended up rather than where they were
     when this was decided. */
  const bowed = links.some(l => {
    const a = box(l.from), b = box(l.to);
    return a && b && Math.abs(a.y - b.y) < 8 && l.to !== l.from + 1;
  });
  if (bowed !== cards.classList.contains('bowed')) {
    cards.classList.toggle('bowed', bowed);
    return void requestAnimationFrame(() => drawLinks(links));
  }
  svg.setAttribute('width', String(cards.offsetWidth));
  svg.setAttribute('height', String(cards.offsetHeight));
  let d = '';
  for (const link of links) {
    const a = box(link.from), b = box(link.to);
    if (!a || !b) continue;
    const seed = hashSeed(`${link.from}>${link.to}`);
    const shared = link.shared.length > 0;
    const style = { w: shared ? 1.7 : 1.3, dash: shared ? null : '7 6', opacity: shared ? 1 : 0.5 };
    const row = Math.abs(a.y - b.y) < 8;
    const next = link.to === link.from + 1;
    let mid;
    if (row && next) {
      // side by side: the short hop, straight across the gap
      const p = [a.x + a.w, a.y + a.h / 2], q = [b.x, b.y + b.h / 2];
      d += stroke(roughLine(p, q, { seed }), style);
      d += arrowHead(q, 0, { seed, w: style.w, size: 10 });
      mid = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    } else if (!row && next) {
      // the card below: straight down into the top of it
      const p = [a.x + a.w / 2, a.y + a.h], q = [b.x + b.w / 2, b.y];
      d += stroke(roughLine(p, q, { seed }), style);
      d += arrowHead(q, Math.PI / 2, { seed, w: style.w, size: 10 });
      mid = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    } else {
      /* A chapter reaching past its neighbours. Along a row it bows over the
         top of the cards in between; down a column it goes out and around
         their side. Either way it must not be drawn through them — a line
         crossing a card reads as a line about that card. */
      const p = row ? [a.x + a.w / 2, a.y] : [a.x + a.w, a.y + a.h / 2];
      const q = row ? [b.x + b.w / 2, b.y] : [b.x + b.w, b.y + b.h / 2];
      // capped, or a link across a wide row arcs up through the heading
      const lift = row
        ? Math.min(84, Math.max(38, Math.abs(q[0] - p[0]) * 0.16))
        : Math.min(96, 44 + (link.to - link.from) * 14);
      const c1 = row ? [p[0], p[1] - lift] : [p[0] + lift, p[1]];
      const c2 = row ? [q[0], q[1] - lift] : [q[0] + lift, q[1]];
      d += stroke(`M${p[0]} ${p[1]}C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${q[0]} ${q[1]}`, style);
      d += arrowHead(q, Math.atan2(q[1] - c2[1], q[0] - c2[0]), { seed, w: style.w, size: 10 });
      mid = [
        (p[0] + 3 * c1[0] + 3 * c2[0] + q[0]) / 8,
        (p[1] + 3 * c1[1] + 3 * c2[1] + q[1]) / 8,
      ];
    }
    const tag = document.createElement('span');
    /* A bow hangs in open paper above the row and can have its name on one
       line; the hop to the next card has only the gutter, and is kept down to
       it by `.maplabel`. */
    tag.className = 'maplabel' + (shared ? '' : ' then') + (next ? '' : ' free');
    /* The pill wraps inside the gutter, and a box named `css_fulfilled_orders`
       is one word to the browser — left alone it breaks wherever the edge
       falls. A zero-width space after each separator offers it somewhere to
       break that a reader would have broken too. */
    tag.textContent = linkLabel(link).replace(/([_./\-])/g, '$1\u200b');
    tag.title = shared
      ? `chapters ${link.from} and ${link.to} both draw ${link.shared.join(', ')}`
      : `chapter ${link.to} follows chapter ${link.from}`;
    tag.style.left = `${mid[0]}px`;
    tag.style.top = `${mid[1]}px`;
    wrap.appendChild(tag);
  }
  svg.innerHTML = d;
  declutter(wrap);
}

/* Two links can cross near their middles — a bow coming back over the row ends
   up where the hop below it starts — and then one name sits on the other and
   neither can be read. Each pill in turn is nudged along the link it belongs
   to until it is clear of the ones already placed; a label a few pixels off
   its midpoint still reads as that link's, an unreadable one reads as
   nothing. */
function declutter(wrap) {
  const tags = [...wrap.querySelectorAll('.maplabel')];
  const box = el => {
    const t = parseFloat(el.style.top), l = parseFloat(el.style.left);
    return { t: t - el.offsetHeight / 2, b: t + el.offsetHeight / 2, l: l - el.offsetWidth / 2, r: l + el.offsetWidth / 2 };
  };
  const hits = (p, q) => p.l < q.r + 4 && p.r + 4 > q.l && p.t < q.b + 3 && p.b + 3 > q.t;
  const placed = [];
  for (const tag of tags) {
    const home = parseFloat(tag.style.top);
    for (let tries = 0; tries < 14; tries++) {
      const r = box(tag);
      if (!placed.some(p => hits(r, p))) break;
      // out from the midpoint, alternating sides, so a pair ends up straddling it
      const step = Math.ceil((tries + 1) / 2) * (tag.offsetHeight + 7);
      tag.style.top = `${home + (tries % 2 ? -step : step)}px`;
    }
    placed.push(box(tag));
  }
}

/* `keep` is for the tape moving the board itself. Anything else that opens the
   map or a chapter is a reader going somewhere, and the tape stops and picks
   up what is now in front of them (see rescope). */
function showMap(keep = false) {
  if (replaying) return;
  mapOpen = true;
  $('map').hidden = false;
  $('map').classList.remove('leaving');
  if (!keep) rescope();
  if (location.hash !== '#map') history.replaceState(null, '', location.pathname + location.search + '#map');
  renderChapters();
  renderMap();
}

function closeMap() {
  mapOpen = false;
  $('map').hidden = true;
  $('map').classList.remove('leaving');
}

/* Opening a chapter from the map. The card is held on screen a beat while it
   grows, so the chapter that comes up is visibly the one that was pointed at
   rather than a tab that changed somewhere. */
function enterChapter(i, card, keep = false) {
  if (!card) { closeMap(); showChapter(i, keep); return Promise.resolve(); }
  card.classList.add('going');
  $('map').classList.add('leaving');
  // resolves once the chapter is up, for a tape that has to wait for it
  return new Promise(done => setTimeout(() => { closeMap(); showChapter(i, keep); done(); }, 230));
}

/* `null` is the live chapter. Switching is a local move: nothing is posted,
   so two people reading the same board can be in different chapters. */
function showChapter(i, keep = false) {
  if (i != null && !board?.chapters?.[i]) i = null;
  if (mapOpen) closeMap();
  if (!keep) rescope();
  viewing = i;
  chapterStep = i == null ? null : (board.chapters[i].active ?? null);
  changed.delete(i);              // you are looking at it now
  drawn = inkFor(inkKey(i));
  userMoved = false;
  const hash = i == null ? '' : `#${i + 1}`;
  if (location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);
  renderChapters(); renderRail(); render(); renderSteps(); fit(true);
}

/* A link into one chapter — /b/<name>#2 — opens there. The number is a
   finished chapter's position, which never moves once it is finished. */
const chapterFromHash = () => {
  const n = Number((location.hash || '').slice(1));
  return Number.isInteger(n) && n >= 1 && n <= (board?.chapters?.length || 0) ? n - 1 : null;
};
addEventListener('hashchange', () => {
  if (location.hash === '#map') showMap(); else showChapter(chapterFromHash());
});

/* ---------- following the step ----------

   Walking the flow dims everything that is not part of the step. On a board
   wider than the pane that is the wrong way round: the step you asked for can
   be off screen, and all you see is the part you were not asking about going
   grey. So the camera brings the lit boxes into view.

   It is a toggle because the other reading is just as reasonable — someone
   zoomed into one corner on purpose does not want the view yanked away by a
   step they pressed to read the script, not to move the picture. The rule for
   when it stays put lives in board/camera.js, where it can be tested.

   Remembered across reloads: a board is reloaded often enough (a restarted
   server, a reopened pane) that re-asserting a preference every time would
   make it feel like it never took. */
let following = true;
try { following = localStorage.getItem('spiega.follow') !== 'off'; } catch { /* private window */ }

/* What a reader can actually see: the stage, less the steps bar that floats
   over the bottom of it. Framing to the full stage would park the subject
   underneath the bar on a short pane. */
function visibleArea() {
  const bar = $('steps');
  const inset = bar.hidden ? 0 : bar.offsetHeight;
  return { x0: 0, y0: 0, x1: stage.clientWidth, y1: stage.clientHeight - inset };
}

function frameStep() {
  if (!following || replaying) return;
  const b = view_of();
  if (b?.active == null) return;
  const next = frame({
    subject: unionBox(lastBoxes, litKeys(b.flow?.[b.active])),
    canvas: { w: +pan.dataset.w || 1, h: +pan.dataset.h || 1 },
    view, visible: visibleArea(), offset: lastOffset,
  });
  if (!next) return;              // already in view, or the whole board is
  view = next;
  // the camera is placed now, so a box arriving later must not snap it back
  userMoved = true;
  pan.style.transition = 'transform .5s cubic-bezier(.33,.7,.3,1)';
  applyView();
}

/* An icon has no word to go off, so the state has to be legible some other
   way: `on` fills it, and aria-pressed says the same thing out loud. */
const showFollow = () => {
  $('follow').classList.toggle('on', following);
  $('follow').setAttribute('aria-pressed', String(following));
};
showFollow();
$('follow').onclick = () => {
  following = !following;
  showFollow();
  try { localStorage.setItem('spiega.follow', following ? 'on' : 'off'); } catch { /* private window */ }
  if (following) frameStep();     // show what it does, rather than describing it
};

/* ---------- the tape ----------

   Each line of the script is a section. Playing one reads it aloud, lights
   the word being spoken, and — when the line is tagged with a step — walks
   the board to that step as the line begins, so the picture moves with the
   words instead of after them.

   Modelled on effect.institute: space plays and pauses, a click starts from
   the line you clicked, and the tape runs on by itself. */
/* What the tape is a tape *of*.

   From inside a chapter it is that chapter's script. From the map it is the
   whole board's: the outline, then each chapter as it is opened (see
   src/board/tape.js for what goes on it). The scope is chosen when the reader
   goes somewhere, and then held — the dive closes the map and switches chapter
   itself, and a scope that followed the screen would turn into "this chapter"
   the moment the first one opened and take the tape from under its own feet.

   So anything that is a reader going somewhere calls rescope(), which stops
   the tape and starts a new one at the top. The tape moving the board passes
   `keep` and does not. */
let tapeWhole = false;
let tape = [];                  // the sections the narrator holds, as plain data

function rescope() {
  tapeWhole = mapOpen && worthAnOutline(board);
  narrator.rewind();
}

const ICON = {
  play: '<svg viewBox="0 0 12 12"><path d="M2.5 1v10L11 6z"/></svg>',
  pause: '<svg viewBox="0 0 12 12"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg>',
};

/* The narrator announces itself here, and everything that shows the tape —
   the transport, the rail's markers, the card being described — is drawn from
   that one announcement. Nothing else toggles them. */
function paintTransport({ playing: speaking, index, total, rate }) {
  const play = $('narrate');
  play.classList.toggle('on', speaking);
  play.innerHTML = speaking ? ICON.pause : ICON.play;
  play.setAttribute('aria-label', speaking ? 'pause' : 'play');
  play.disabled = !total;
  $('tprev').disabled = !total || index <= 0;
  $('tnext').disabled = !total || index >= total - 1;
  $('tpos').textContent = total ? `${index < 0 ? '–' : index + 1}/${total}` : '';
  $('rate').textContent = rateLabel(rate);

  /* One player at a time. With a voice and something to say, the transport
     is the player and the steps bar's timer goes away; it comes back as the
     silent way through a flow when there is no voice or nothing was said. */
  const drives = narrator.available && total > 0;
  $('play').hidden = drives;
  if (drives && playing) stopPlay();

  const rail = $('rail');
  const rows = [...rail.querySelectorAll('.said')];
  const marks = railMarks(tape, index, viewing, rows.length);
  rail.classList.toggle('scrub', index >= 0 && marks.some(Boolean));
  rows.forEach((row, i) => {
    row.classList.toggle('heard', marks[i] === 'heard');
    row.classList.toggle('saying', marks[i] === 'now');
  });
  const row = rail.querySelector('.said.saying');
  if (row) {
    const top = row.offsetTop - rail.clientHeight / 2 + row.offsetHeight / 2;
    rail.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }

  // while the outline is read, the card it is about is the thing that is lit
  const cards = $('mapcards');
  const at = tape[index];
  const lit = at?.kind === 'outline' && at.card ? cards.querySelector(`.mapcard[data-n="${at.card}"]`) : null;
  cards.querySelectorAll('.mapcard.speaking').forEach(c => { if (c !== lit) c.classList.remove('speaking'); });
  if (lit && !lit.classList.contains('speaking')) {
    lit.classList.add('speaking');
    lit.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

const narrator = createNarrator({ onState: paintTransport });
$('transport').hidden = !narrator.available;

/* The words of an element, numbered by where they start. Wrapped on demand: a
   map card is rebuilt whenever the board changes, and the one being read may
   have been rebuilt since the sentence began. */
const wordsIn = (el, wrap = true) => {
  if (!el) return [];
  if (wrap && !el.querySelector('.w')) wrapWords(el);
  return [...el.querySelectorAll('.w')];
};

/* Where a section's words are on screen right now, or null when they are not
   on screen at all — a chapter's rail row while another chapter is open. */
function targetOf(s) {
  if (s.kind === 'outline') {
    if (s.part === 'lede') return $('maplede');
    const card = $('mapcards').querySelector(`.mapcard[data-n="${s.card}"]`);
    return card?.querySelector(s.part === 'title' ? '.t' : '.line') ?? null;
  }
  return viewing === s.chapter
    ? $('rail').querySelector(`.said[data-line="${s.line}"] .said-body`)
    : null;
}

/* Give a section its behaviour: what the board does as it begins, as each word
   is spoken, and when it is done. The data is src/board/tape.js's; this is the
   part that needs a page. */
function decorate(s, k, all) {
  const d = {
    ...s,
    async onStart() {
      /* The board goes where the words are, at whatever scale that is: the map
         for the outline, a chapter for a line, and in the chapter the step. A
         chapter opened from the map grows out of its card; one reached from
         another chapter is simply switched to. */
      if (s.kind === 'outline') {
        if (!mapOpen) showMap(true);
      } else if (mapOpen || s.chapter !== viewing) {
        if (mapOpen) {
          await enterChapter(s.chapter, $('mapcards').querySelector(`.mapcard[data-n="${s.card}"]`), true);
        } else showChapter(s.chapter, true);
      }
      const el = targetOf(s);
      wordsIn(el).forEach(w => w.classList.remove('lit'));
      // what is spoken is what is on screen, character for character
      if (el) d.text = el.textContent;
      if (s.kind === 'line' && s.step != null && view_of()?.active !== s.step) focus(s.step);
    },
    onWord(at) {
      const words = wordsIn(targetOf(s));
      const w = words[wordAt(words.map(x => +x.dataset.at), at)];
      if (!w || w.classList.contains('lit')) return;
      words.forEach(x => x.classList.remove('lit'));
      w.classList.add('lit');
    },
    async onDone(alive) {
      wordsIn(targetOf(s), false).forEach(w => w.classList.remove('lit'));
      /* The end of a tour that began on the map goes back to it, after a
         moment to take in the last thing said. */
      if (all[0].kind === 'outline' && k === all.length - 1) {
        await beat(1600);
        if (alive() && !mapOpen) showMap(true);
      }
    },
  };
  return d;
}

/* Hand the narrator the current script. Rebuilt whenever the rail or the map
   is, which is cheap: sections look their elements up when they need them. */
function loadTape() {
  tape = tapeOf(board, { whole: tapeWhole && !shown, surface: view_of(), viewing });
  narrator.load(tape.map(decorate));
}

/* The voice list arrives late in Chrome — getVoices() is empty on the first
   call and fills in on `voiceschanged` — so this runs again when it does. */
function fillVoices() {
  const sel = $('voicepick');
  const all = narrator.voices();
  if (!all.length) { sel.hidden = true; return; }
  const current = narrator.voiceName;
  if (sel.dataset.filled === String(all.length) && sel.value === current) return;
  sel.innerHTML = all.map(v =>
    `<option value="${v.name}"${v.name === current ? ' selected' : ''}>` +
    `${v.name}${v.local ? '' : ' · online'}</option>`).join('');
  sel.dataset.filled = String(all.length);
  sel.hidden = false;
}
if (typeof speechSynthesis !== 'undefined') {
  fillVoices();
  speechSynthesis.addEventListener?.('voiceschanged', fillVoices);
} else {
  $('voicepick').hidden = true;
}

$('voicepick').onchange = e => {
  narrator.setVoice(e.target.value);
  narrator.sample();          // hear it immediately, which is how you choose
};

async function narrate(action = () => narrator.toggle()) {
  if (!narrator.available) { $('narrate').textContent = 'no voice'; return; }
  if (!await finish()) return;
  action();
}
$('narrate').onclick = () => narrate();
$('tprev').onclick = () => narrate(() => narrator.prev());
$('tnext').onclick = () => narrate(() => narrator.next());
$('rate').onclick = () => narrator.setRate(nextRate(narrator.rate));

/* Click a line of the script to walk the step it explains.

   One delegated listener rather than one per line, because the rail is
   append-only and rebinding on every state change would leak handlers. A
   second click on the step already lit clears it, so the same gesture gets you
   out — and a replay owns the screen while it runs, so clicks are ignored
   until it ends. */
$('rail').addEventListener('click', e => {
  if (replaying) return;
  const row = e.target.closest?.('.said');
  if (!row) return;
  /* A click starts the tape at that line — "advance the tape", rather than
     "select an item". The step follows from the line, as it does when the
     tape reaches it by itself. */
  const at = locate(tape, viewing, Number(row.dataset.line));
  if (narrator.available && narrator.playing) return narrator.play(at >= 0 ? at : undefined);
  const want = clickStep(view_of(), Number(row.dataset.step));
  if (want !== undefined) focus(want);
  // paused, it still moves the playhead: the next play starts from here
  if (narrator.available && at >= 0) narrator.park(at);
});
$('prev').onclick = () => focus(Math.max(0, (board.active ?? 0) - 1));
$('next').onclick = () => focus(board.active == null ? 0 : Math.min(board.flow.length - 1, board.active + 1));
/* Play walks the flow on a timer. Starting and stopping are two named
   functions, not one toggle that re-enters itself: the earlier version ended
   the run by clicking its own button, which fired before `playing` had been
   assigned, so a play pressed on the last step recursed until the stack gave
   out — and left the button stuck reading "stop", refusing every later press. */
function stopPlay() {
  if (playing) clearInterval(playing);
  playing = null;
  $('play').classList.remove('on');
  $('play').textContent = 'play';
}

function startPlay() {
  const f = board?.flow || [];
  if (!f.length) return;
  // pressing play while parked on the last step means start again, not stop
  let i = board.active == null || board.active >= f.length - 1 ? -1 : board.active;
  $('play').classList.add('on');
  $('play').textContent = 'stop';
  const tick = () => {
    if (++i >= (board?.flow?.length || 0)) return stopPlay();
    focus(i);
  };
  playing = setInterval(tick, 1600);   // assigned before the first tick, so stop can always find it
  tick();
}

$('play').onclick = () => (playing ? stopPlay() : startPlay());

/* ---------- replay: the session, as it happened ---------- */

/* A finished board shows the answer but not the thinking, and on anything
   complex the answer alone is a wall. Replay puts the session back: the line
   that was said, then the thing it was about being drawn, in the order it
   happened — and the camera goes where the work is, because a fifteen-box
   board shrunk to fit is a diagram again, not a explanation.

   Wall-clock gaps are thrown away. An agent may have thought for a minute
   between two boxes; nobody wants to watch that. Pacing comes from how much
   there is to read, not from how long it originally took. */

let replaying = false;
let gen = 0;            // bumped on every start and stop, so a loop suspended in
                        // an await can tell that the run it belongs to is over —
                        // the flag alone is not enough: stop, then start again,
                        // and the old loop wakes to find `replaying` true and
                        // carries on alongside the new one.
const beat = ms => new Promise(r => setTimeout(r, ms));

/* Ease the camera onto whatever was just drawn — but only when there is a
   reason to move. A board that already fits gets a held wide shot: a camera
   that cuts around content you can see anyway is just motion sickness. And the
   view never pans past the board's own edges, or the subject ends up framed
   against empty paper. */
function panTo(key) {
  const W = +pan.dataset.w || 1, H = +pan.dataset.h || 1;
  const aw = stage.clientWidth - 32, ah = stage.clientHeight - 96;
  if (aw < 60 || ah < 60) return;

  const fitK = Math.min(1.15, aw / W, ah / H);
  if (fitK >= 0.72) { userMoved = false; fit(true); return; }   // it all fits: hold

  const b = lastBoxes[key] || (() => {
    const [from, to] = String(key).split('>');          // an edge: frame both ends
    const p = lastBoxes[from], q = lastBoxes[to];
    if (!p || !q) return null;
    const x = Math.min(p.x, q.x), y = Math.min(p.y, q.y);
    return { x, y, w: Math.max(p.x + p.w, q.x + q.w) - x, h: Math.max(p.y + p.h, q.y + q.h) - y };
  })();
  if (!b) return;

  // close enough to read, with room around it: context is what makes a box
  // read as part of a system rather than as a box
  const k = Math.max(fitK, Math.min(0.95, aw / (b.w * 2.4), ah / (b.h * 3.2)));
  const cx = (b.x + b.w / 2 + MARGIN) * k, cy = (b.y + b.h / 2 + MARGIN) * k;
  const span = (total, avail, centre) => total * k <= avail
    ? (avail - total * k) / 2 + 16                      // fits on this axis: centre it
    : Math.min(16, Math.max(avail - total * k + 16, avail / 2 - centre));

  view = { k, x: span(W, stage.clientWidth, cx), y: span(H, stage.clientHeight - 60, cy) };
  pan.style.transition = 'transform .75s cubic-bezier(.33,.7,.3,1)';
  applyView();
}

/* Put a line on screen, or clear it. */
function say(text, problem = false) {
  const c = $('caption');
  c.classList.toggle('problem', problem);
  if (!text) { c.classList.remove('on'); setTimeout(() => { if (!c.classList.contains('on')) c.hidden = true; }, 320); return; }
  c.innerHTML = mdish(text);
  c.hidden = false;
  requestAnimationFrame(() => c.classList.add('on'));
}

function stopReplay() {
  replaying = false;
  gen++;
  say(null);
  shown = null;
  replayAt = null;
  // the replay drew the live chapter last, under its own key: keep that ink
  inked.set('live', inkFor(`ch${board?.chapters?.length ?? 0}`));
  drawn = inkFor('live');
  $('replay').classList.remove('on');
  $('replay').textContent = 'replay';
  render(); renderRail(); renderSteps(); renderChapters();
  userMoved = false; fit(true);
}

/* The log as a replay should walk it.

   Amendments to one chapter arrive in a run — a box, the edge into it, the
   line that explains it, all aimed at chapter one in the same breath — and
   played one at a time the replay bounces out of the chapter and back for
   each. Six trips to say one thing. A run of them to the same chapter was one
   thought, so it is played as one visit. */
export function replayEntries(log) {
  const out = [];
  for (const e of log) {
    if (e.op === 'focus' || e.op === 'clear') continue;
    const prev = out[out.length - 1];
    if (e.op === 'amend' && prev?.op === 'amend' && prev.chapter === e.chapter) {
      prev.ops = [...prev.ops, ...[].concat(e.ops || [])];
      continue;
    }
    out.push(e.op === 'amend' ? { ...e, ops: [].concat(e.ops || []) } : e);
  }
  return out;
}

async function replay() {
  if (replaying) return stopReplay();
  if (!await finish()) return;
  const log = replayEntries(board?.log || []);
  if (!log.length) return;

  const mine = ++gen;
  const live = () => replaying && gen === mine;
  replaying = true;
  userMoved = false;
  // a replay owns the screen, and it walks the chapters itself
  viewing = null; closeMap(); changed.clear(); renderChapters();
  rescope();
  $('replay').classList.add('on');
  $('replay').textContent = 'stop';

  const rb = emptyBoard();
  shown = rb;
  inked.clear();
  drawn = inkFor('ch0');
  render(); renderRail(); renderSteps();
  await beat(400);

  if (!live()) return;
  for (const entry of log) {
    if (!live()) return;
    const before = new Set(drawn);
    applyOps(rb, [entry]);

    if (entry.op === 'say') {
      renderRail();
      say(entry.text);
      // time to read it, floored so a short line still lands
      await beat(Math.min(4200, 850 + (entry.text || '').length * 26));
      continue;   // the loop head re-checks live()
    }
    if (entry.op === 'title') { $('title').textContent = rb.title; continue; }

    /* A chapter break, played as one: the surface empties, its name is held on
       screen for a beat, and the next chapter is drawn on from nothing. The
       whole explanation plays straight through, which is the half of a
       chaptered board that `clear` could never give back (#51). */
    if (entry.op === 'chapter') {
      drawn = inkFor(`ch${rb.chapters.length}`);
      renderRail(); render(); renderSteps(); renderChapters();
      if (rb.chapter) { say(`**${rb.chapter}**`); await beat(1500); say(null); await beat(260); }
      continue;
    }

    /* An amendment happened at a moment in the session, to a chapter that was
       no longer on screen. Played where it happened: the replay steps back
       into that chapter, draws what was added, and returns to where the
       explanation had got to. */
    if (entry.op === 'amend') {
      const i = Number(entry.chapter) - 1;
      if (!(i >= 0 && i < (rb.chapters?.length || 0))) continue;
      const home = drawn;
      replayAt = i;
      drawn = inkFor(`ch${i}`);
      say(`back to **${rb.chapters[i].title || 'the chapter before'}**`);
      renderChapters();
      renderRail();
      const ms = render() || 400;
      renderSteps();
      await beat(Math.max(1200, ms + 600));
      if (!live()) return;
      say(null);
      replayAt = null;
      drawn = home;
      renderRail(); render(); renderSteps(); renderChapters();
      await beat(320);
      continue;
    }

    const drawMs = render() || 400;
    renderSteps();
    // frame whatever is new, once it has somewhere to be
    const added = [...drawn].find(k => !before.has(k));
    if (added) { await beat(90); if (!live()) return; panTo(added); }
    await beat(Math.max(520, drawMs + 260));
  }

  if (!live()) return;
  // the closing wide shot
  userMoved = false;
  fit(true);
  await beat(1100);
  if (!live()) return;
  stopReplay();
}

$('replay').onclick = replay;

/* ---------- plumbing ---------- */

async function post(ops) {
  if (globalThis.__SPIEGA_EXPORT__) {
    // The file is a reader's private copy: step navigation changes only this
    // tab, never a server or another reader's board.
    if (ops[0]?.op === 'focus') { board = { ...board, active: ops[0].step }; onState(board); }
    return;
  }
  await fetch(API + 'op', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ops }) });
}

async function finish() {
  if (globalThis.__SPIEGA_EXPORT__) return true;
  if (!board || board.settled || !board.nodes.length || replaying) return true;
  try {
    const response = await fetch(API + 'settle', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}',
    });
    if (!response.ok) throw new Error('settle request failed');
    const result = await response.json();
    // The stream may have delivered this already; otherwise show the result
    // before starting the tape, rather than speaking over the old arrangement.
    if (result.board.rev !== board.rev) onState(result.board);
    say(null);
    return true;
  } catch {
    say('spiega could not tidy this board — narration and replay have not started. Try again when the server is connected.', true);
    return false;
  }
}

function onState(b, fresh, amended = []) {
  const first = !board;
  const had = board?.chapters?.length || 0;
  const now = b.chapters?.length || 0;
  board = b;
  /* A chapter was amended: mark its tab unless its reader is looking at it,
     in which case the new boxes are drawn on in front of them instead. */
  for (const n of amended) {
    const i = Number(n) - 1 < (b.chapters?.length || 0) ? Number(n) - 1 : null;
    if (i !== viewing) changed.add(i);
  }
  /* A chapter break empties the live surface, so the next chapter's first
     boxes must draw themselves on — that is the one thing this board does.
     The ink of what was just being drawn is not lost, though: it belongs to
     the chapter that surface became, so going back to read it later shows it
     as it was rather than drawing it again. */
  if (now !== had) {
    if (now > had) {
      inked.set(inkKey(now - 1), inkFor('live'));
      inked.set('live', new Set());
    } else {
      inked.clear();                 // cleared, or a board this window has not seen
    }
    if (viewing == null) { drawn = inkFor('live'); userMoved = false; }
  }
  // Something arrived on the live chapter while an earlier one is being read.
  if (viewing != null && !first) changed.add(null);
  // A replay owns the screen while it runs; the live board keeps updating
  // underneath and is shown again when the replay ends.
  if (replaying) return;
  $('title').textContent = b.title || 'spiega';
  // The board name goes in the window title because that is the only handle an
  // OS has on a browser app window: `spiega focus` finds the window by it.
  document.title = (b.title ? `${b.title} · spiega` : 'spiega') + (boardTag ? ` [${boardTag}]` : '');
  setLink('live');
  clearTimeout(onState._t);
  if (!exported) onState._t = setTimeout(() => setLink(es && es.readyState === EventSource.OPEN ? 'idle' : 'down'), 2500);
  if (first && chapterFromHash() != null) return void showChapter(chapterFromHash());
  /* Where a reader lands. A link into a chapter wins; otherwise an
     explanation that already has several chapters by the time this window
     opens is one nobody here watched being drawn, and the map is the honest
     first page for it. The explainer's own window opens on an empty board and
     never hits this, which is the point: a map must never take the drawing
     away from the person drawing it. */
  if (first && location.hash === '#map') { showMap(); return; }
  if (first && (b.chapters?.length || 0) >= 2 && !location.hash) { showMap(); return; }
  if (mapOpen) renderMap();
  renderChapters();
  renderRail();
  render(fresh);
  renderSteps();
  if (first) userMoved = false;
  // A step change is the only thing the camera follows, and it arrives here
  // however it was asked for: the arrows, a click in the rail, play, or the
  // narrator reaching a line that is tagged with it.
  if (b.active !== lastActive) { lastActive = b.active; frameStep(); }
}

/* The stream is the only thing keeping this page true. If it dies — the server
   restarted, the machine slept, the network blinked — a board that silently
   keeps showing its last state is worse than no board, because it looks like an
   answer. So: reconnect with backoff, say so in the bar while disconnected, and
   re-sync whenever the window is looked at again. */
let es = null, retry = 0, retryTimer = null;

function setLink(state) {           // 'live' | 'idle' | 'down'
  const dot = $('live');
  dot.classList.toggle('idle', state === 'idle');
  dot.classList.toggle('down', state === 'down');
  dot.title = state === 'down' ? 'not connected to the board server'
    : state === 'live' ? 'the agent just drew something' : 'connected, waiting';
  $('offline').hidden = state !== 'down';
}

/* A board nobody is writing down looks exactly like one that is, so it has to
   say so itself. The CLI cannot: by the time anyone notices, the explanation is
   already gone. */
function setSaving(s) {
  const why = s && s.saving === false && s.why !== 'memory' ? s.why : null;
  $('unsaved').hidden = !why;
  if (!why) return;
  $('unsavedwhy').textContent = why === 'other-server'
    ? 'another spiega owns this board\u2019s file \u2014 nothing drawn here will survive a restart'
    : 'this board\u2019s file could not be opened \u2014 nothing drawn here will survive a restart';
}

function connect() {
  clearTimeout(retryTimer);
  if (es) { try { es.close(); } catch {} }
  es = new EventSource(API + 'events');

  es.addEventListener('open', () => { retry = 0; setLink('idle'); });
  es.addEventListener('state', e => {
    // A full state means we may be looking at a different board than before,
    // so forget what we thought was already drawn, on every surface.
    inked.clear();
    drawn = inkFor(inkKey(viewing));
    onState(JSON.parse(e.data));
  });
  es.addEventListener('patch', e => { const d = JSON.parse(e.data); onState(d.board, d.fresh, d.amended); });
  es.addEventListener('saving', e => setSaving(JSON.parse(e.data)));
