  // `spiega replay` — or the agent's own tool — asking for the movie again.
  // Always a start, never a toggle: a remote caller cannot see the button.
  es.addEventListener('replay', () => { if (replaying) stopReplay(); replay(); });
  es.addEventListener('error', () => {
    if (es.readyState === EventSource.CLOSED || es.readyState === EventSource.CONNECTING) {
      setLink('down');
      // EventSource retries on its own, but not after the server refuses the
      // connection outright, which is the case that actually bites here.
      retry = Math.min(retry + 1, 6);
      retryTimer = setTimeout(connect, Math.min(800 * retry, 5000));
    }
  });
}
if (exported) {
  const saved = exported.board;
  if (exported.viewing != null && saved.chapters?.[exported.viewing]) {
    location.hash = `#${exported.viewing + 1}`;
  } else if (exported.viewing === 'live') {
    location.hash = '#live';
  } else if (exported.viewing === 'map') {
    location.hash = '#map';
  }
  onState(saved);
  if (exported.active != null && viewing != null) {
    chapterStep = Number(exported.active);
    renderRail(); render(); renderSteps();
  }
  setLink('idle');
  $('live').title = 'standalone copy';
} else connect();

/* Coming back to the window is the moment a stale board is most misleading. */
addEventListener('visibilitychange', () => {
  if (exported) return;
  if (document.visibilityState !== 'visible') return;
  if (!es || es.readyState !== EventSource.OPEN) connect();
  else fetch(API + 'state').then(r => r.json()).then(b => { if (b.rev !== board?.rev) onState(b); }).catch(() => {});
});

/* ---------- pan, zoom, keys ---------- */

stage.addEventListener('wheel', e => {
  e.preventDefault();
  userMoved = true;
  pan.style.transition = 'none';
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.max(0.2, Math.min(3, view.k * (1 - e.deltaY * 0.0016)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  applyView();
}, { passive: false });

let drag = null;
/* The press, and the box it landed on. The stage captures the pointer, so the
   click that follows is delivered to the stage and not to the box under it:
   the box is the one the press started on.

   How far a press may travel and still be a click: the stage is draggable,
   so the end of a pan is a press that moved — and a pan that happens to end
   on a box must not walk the flow. */
let press = null;
let travelled = false;
const CLICK_SLOP = 5;
stage.addEventListener('pointerdown', e => {
  press = { x: e.clientX, y: e.clientY, node: e.target.closest('g[data-node]') };
  travelled = false;
  if (e.target.closest('.steps, .blank code, .warnings, .caption, .tools')) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  stage.classList.add('drag'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  userMoved = true; pan.style.transition = 'none';
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  applyView();
});
const endDrag = () => { drag = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', e => {
  travelled = press ? Math.hypot(e.clientX - press.x, e.clientY - press.y) > CLICK_SLOP : false;
  endDrag();
});
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('dblclick', e => {
  if (e.target.closest('.tools')) return;   // a double-tap on fit is two fits, not a reset
  userMoved = false; fit(true);
});

/* Clicking a box walks the steps that light it.

   The gesture the rail already teaches, pointed the other way: a line of the
   script leads to the hop it explains, and a box leads to the hops it takes
   part in. A box is lit by several steps — both ends of an edge, so a box in
   the middle of a chain is lit twice — and the walk goes through them one at
   a time, clearing at the end.

   One delegated listener, as the rail has: the boxes are redrawn on every
   state change, so a listener per box would leak one on each redraw.

   Which steps those are is decided in board/script.js, beside the rest of the
   reasoning about steps, so it can be tested without a DOM. */
function clickBox(g) {
  if (replaying) return;              // a replay owns the screen while it runs
  const id = g.dataset.node;
  if (!id) return;
  const b = view_of();
  const want = clickNode(b, id, b?.active ?? null);
  if (want !== undefined) focus(want);
}

stage.addEventListener('click', e => {
  const g = travelled ? null : (e.target.closest('g[data-node]') || press?.node);
  travelled = false;
  press = null;
  if (!g) return;
  clickBox(g);
});

$('fit').onclick = () => { userMoved = false; fit(true); };
function download(scope) {
  if (exported) return;
  const params = new URLSearchParams({ scope });
  const current = viewing == null ? board?.chapters?.length || 0 : viewing;
  if (scope === 'chapter') params.set('chapter', String(current));
  else params.set('viewing', mapOpen ? 'map' : viewing == null ? 'live' : String(viewing));
  const step = view_of()?.active;
  if (step != null) params.set('step', String(step));
  const link = document.createElement('a');
  link.href = API + 'export?' + params;
  link.click();
}
/* One icon, two scopes. An icon can say "export" and cannot say "export
   which", so the choice is a sheet rather than a second glyph nobody can
   tell apart from the first. */
const exportMenu = $('exports');
const closeExports = () => {
  exportMenu.classList.remove('open');
  $('snap').setAttribute('aria-expanded', 'false');
};
$('snap').onclick = () => {
  const open = !exportMenu.classList.contains('open');
  exportMenu.classList.toggle('open', open);
  $('snap').setAttribute('aria-expanded', String(open));
};
$('snap-all').onclick = () => { closeExports(); download('all'); };
$('snap-chapter').onclick = () => { closeExports(); download('chapter'); };
addEventListener('pointerdown', e => { if (!e.target.closest('#exports')) closeExports(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeExports(); });
if (exported) {
  exportMenu.hidden = true;
  if (exported.chapterOnly) $('replay').hidden = true;
}
$('rail-toggle').onclick = e => {
  $('main').classList.toggle('norail');
  const shown = !$('main').classList.contains('norail');
  e.currentTarget.classList.toggle('on', shown);
  e.currentTarget.setAttribute('aria-expanded', String(shown));
  e.currentTarget.setAttribute('aria-label', shown ? 'hide transcript' : 'show transcript');
  setTimeout(() => { if (!userMoved) fit(true); }, 60);
};
if (matchMedia('(max-width:820px)').matches) $('main').classList.add('norail');
$('rail-toggle').classList.toggle('on', !$('main').classList.contains('norail'));
$('rail-toggle').setAttribute('aria-expanded', String(!$('main').classList.contains('norail')));
$('rail-toggle').setAttribute('aria-label', $('main').classList.contains('norail') ? 'show transcript' : 'hide transcript');

/* Zoom in steps, about the centre of the stage. Continuous wheel zoom repaints
   every frame, which is fine in a browser window and miserable in a terminal
   pane, where each frame has to be encoded and pushed through the TTY. One
   keypress, one repaint. */
function zoomBy(factor) {
  userMoved = true;
  const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
  const k = Math.max(0.2, Math.min(3, view.k * factor));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k;
  pan.style.transition = 'transform .18s ease-out';
  applyView();
}

addEventListener('keydown', e => {
  /* The tape owns the transport keys while it exists. Space plays and pauses,
     the up and down arrows move between lines, R restarts the current one —
     the arrangement effect.institute uses, which reads as a player rather
     than as a stepper. Left and right keep their meaning here: they walk the
     flow, which is the board's own axis and not the tape's. */
  if (narrator.available) {
    if (e.key === ' ') { e.preventDefault(); return narrate(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); return narrate(() => narrator.next()); }
    if (e.key === 'ArrowUp') { e.preventDefault(); return narrate(() => narrator.prev()); }
    if (e.key === 'r' && narrator.playing) { e.preventDefault(); return narrator.restart(); }
    if (e.key === '[') { e.preventDefault(); return narrator.setRate(narrator.rate - 0.1); }
    if (e.key === ']') { e.preventDefault(); return narrator.setRate(narrator.rate + 0.1); }
  }
  if (e.key === '+' || e.key === '=') return zoomBy(1.25);
  if (e.key === '-' || e.key === '_') return zoomBy(1 / 1.25);
  if (e.key === '0') { userMoved = false; return fit(true); }
  if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();

  else if (e.key === 'f') $('fit').click();
  else if (e.key === 'r') $('replay').click();
  // out to the map and back in: the gesture a reader reaches for before they
  // have noticed there is a tab for it
  else if (e.key === 'm') { if (mapOpen) showChapter(viewing); else if (board?.chapters?.length) showMap(); }
  else if (e.key === 'Escape') {
    if (replaying) stopReplay();
    else if (mapOpen) showChapter(viewing);
    else focus(null);
  }
});
/* A map that is a narrow pane wide rewraps its cards, and the lines between
   them were drawn where the cards used to be. */
const relink = () => { if (mapOpen) requestAnimationFrame(() => drawLinks(boardMap(board).links)); };
addEventListener('resize', () => { if (!userMoved) fit(); relink(); });
// A board usually lives in a pane someone is dragging wider or narrower.
new ResizeObserver(() => { if (!userMoved) fit(); }).observe(stage);
new ResizeObserver(relink).observe($('mapcards'));
</script>
</body>
</html>
