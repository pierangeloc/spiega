<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spiega</title>
<style>
  :root{
    --paper:#f2efe7; --panel:#f8f6f0; --ink:#231e16; --muted:#857d6e;
    --rule:#ddd6c8; --soft:#ebe6da; --accent:#ef6a4c; --shadow:#41538f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --rail: 310px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:13px/1.55 var(--mono);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .14 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    display:grid; grid-template-rows:auto 1fr; overflow:hidden;
  }

  /* ---- top bar ---- */
  .bar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--rule)}
  /* the voice picker wears the same clothes as the buttons beside it */
  .pick{font:inherit;max-width:190px;appearance:none;-webkit-appearance:none;
    padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
    linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .pick[hidden]{display:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  .dot.idle{background:var(--rule)}
  .dot.down{background:#b3402a;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  .bar h1{font-size:14px;font-weight:700;letter-spacing:.04em;margin:0;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .spacer{flex:1}
  .btn{font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    border:1.5px solid var(--ink);border-radius:999px;padding:5px 13px;background:transparent;color:var(--ink);
    cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--soft)}
  .btn:disabled{opacity:.3;cursor:default}
  .btn.on{background:var(--ink);color:var(--paper);box-shadow:2px 2px 0 var(--accent)}
  .count{font-size:11px;color:var(--muted);letter-spacing:.06em}

  /* ---- the two panes ---- */
  main{display:grid;grid-template-columns:var(--rail) 1fr;min-height:0;position:relative}
  main.norail{grid-template-columns:0 1fr}
  /* In a split pane the rail would eat the board, so below this width it
     becomes a drawer over the drawing instead of a column beside it. */
  @media (max-width:820px){
    main{grid-template-columns:0 1fr}
    .rail{position:absolute;inset:0 auto 0 0;width:min(300px,78vw);z-index:5;
      background:var(--paper);box-shadow:6px 0 0 rgba(35,30,22,.06)}
    main.norail .rail{display:none}
    main:not(.norail) .rail{display:flex}
  }

  /* ---- transcript rail: what was said while it was drawn ---- */
  .rail{grid-column:1;border-right:1px solid var(--rule);overflow-y:auto;padding:16px 14px 40px;display:flex;
    flex-direction:column;gap:9px;min-width:0}
  main.norail .rail{display:none}
  /* `backwards`, not `forwards`: a fill-forwards animation keeps owning opacity
     after it ends and would outrank .off below, so a dimmed line would stay
     bright. The keyframe holds the pre-start state instead. */
  .said{background:var(--panel);border:1.5px solid var(--ink);border-radius:12px;padding:9px 12px;
    font-size:12.5px;line-height:1.5;box-shadow:3px 3px 0 var(--soft);
    animation:in .32s ease backwards}
  .said.latest{box-shadow:3px 3px 0 var(--accent)}
  /* Stepping the flow lights the drawing; the script has to follow, or the
     reader is left matching sentence to picture by hand. A line that belongs
     to another step recedes rather than disappearing — the shape of the whole
     explanation stays readable — and a line tied to no step never dims. */
  .said.on{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent);background:var(--paper)}
  .said.on .tag{color:var(--accent)}
  .said.off{opacity:.42;box-shadow:3px 3px 0 var(--soft);filter:saturate(.55)}
  /* only the lines that lead somewhere look like they do */
  /* The word being spoken. A background rather than a colour change, because
     a colour change on one word in a paragraph is hard to catch at a glance
     and the whole point is to be followable without looking for it. */
  .said .w.lit{background:var(--accent);color:var(--paper);border-radius:3px;
    box-shadow:0 0 0 2px var(--accent)}
  .said.saying{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}
  .said.go{cursor:pointer}
  .said{cursor:pointer}
  .said.go:hover{border-color:var(--accent);box-shadow:4px 4px 0 var(--accent);transform:translateY(-1px)}
  .said.go:hover .tag{color:var(--accent)}
  .said.go:active{transform:translateY(0);box-shadow:2px 2px 0 var(--accent)}
  .said.go.on:hover{box-shadow:4px 4px 0 var(--accent)}
  .said{transition:opacity .28s ease, border-color .28s ease, box-shadow .28s ease, filter .28s ease}
  .said .tag{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-bottom:3px}
  .said b{font-weight:700}
  .said code{background:var(--soft);padding:1px 4px;border-radius:4px;font-size:11.5px}
  .rail .empty{color:var(--muted);font-size:12px;padding:6px 2px}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ---- the board ---- */
  .stage{grid-column:2;position:relative;overflow:hidden;min-width:0;cursor:grab}
  .stage.drag{cursor:grabbing}
  .pan{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .pan svg{display:block}
  .pan text{font-family:var(--mono)}
  /* grain over the drawing, as an overlay rather than an SVG filter: the board
     redraws while it animates, and a filter would be recomputed every frame */
  .stage::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.42;
    background-size:180px 180px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .18  0 0 0 0 .15  0 0 0 0 .11  .5 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23g)' opacity='.55'/></svg>")}

  .blank[hidden]{display:none}
  .blank{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;color:var(--muted)}
  .blank .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .blank code{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:3px 7px;font-size:11.5px}

  /* ---- step strip ---- */
  .steps{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
    padding:11px 16px;background:color-mix(in srgb, var(--panel) 88%, transparent);
    border-top:1px solid var(--rule);backdrop-filter:blur(3px)}
  .steps[hidden]{display:none}
  .steps .n{font-size:11px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
  .steps .txt{flex:1;font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The line being said, over the drawing. The rail is collapsed in a narrow
     pane and scrolled away in a wide one, so during a replay the words have to
     come to the picture. */
  .caption{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;z-index:4;max-width:min(680px,88%);
    background:var(--ink);color:var(--paper);border-radius:13px;padding:10px 16px;font-size:14px;line-height:1.5;
    box-shadow:4px 4px 0 rgba(35,30,22,.18);text-align:center;opacity:0;transition:opacity .3s}
  .caption[hidden]{display:none}
  .caption.on{opacity:1}
  .caption b{color:var(--accent)}
  .warnings{position:absolute;left:0;right:0;top:0;z-index:6}
  .offline{display:flex;gap:10px;align-items:baseline;
    justify-content:center;padding:7px 14px;background:#b3402a;color:var(--paper);font-size:11.5px}
  .offline[hidden]{display:none}
  .offline .k{text-transform:uppercase;letter-spacing:.12em;font-weight:700}
  /* Not red: being disconnected means this board may be stale, which a
     reconnect fixes. Not being saved means the session is going to be lost,
     which nothing here fixes. Two different alarms deserve two colours. */
  .unsaved{background:#9a6a15}
  .zoom{position:absolute;right:14px;top:12px;display:flex;gap:6px}
</style>
</head>
<body>
  <div class="bar">
    <span class="dot idle" id="live" title="waiting for the agent"></span>
    <h1 id="title">spiega</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button class="btn" id="rail-toggle" title="hide the transcript">transcript</button>
    <button class="btn" id="narrate" title="read the script aloud — space plays and pauses">narrate</button>
    <select class="btn pick" id="voicepick" title="which voice reads it — choosing one speaks a sample"></select>
    <button class="btn" id="replay" title="play the session back as it happened">replay</button>
    <button class="btn" id="follow" title="keep the lit boxes in view while walking the flow">follow</button>
    <button class="btn" id="fit">fit</button>
    <button class="btn" id="snap" title="open a standalone copy of this board">snapshot</button>
  </div>

  <main id="main">
    <aside class="rail" id="rail"><div class="empty">Nothing said yet.</div></aside>
    <div class="stage" id="stage">
      <div class="pan" id="pan"></div>
      <div class="blank" id="blank">
        <div class="k">the board is empty</div>
        <div><code>spiega draw '{"op":"node","label":"API Gateway","kind":"gateway"}'</code></div>
      </div>
      <div class="warnings">
        <div class="offline" id="offline" hidden>
          <span class="k">not connected</span>
          <span>this board may be out of date &mdash; reconnecting&hellip;</span>
        </div>
        <div class="offline unsaved" id="unsaved" hidden>
          <span class="k">not being saved</span>
          <span id="unsavedwhy"></span>
        </div>
      </div>
      <div class="caption" id="caption" hidden></div>
      <div class="steps" id="steps" hidden>
        <button class="btn" id="prev">&larr;</button>
        <span class="n" id="stepn"></span>
        <span class="txt" id="steptxt"></span>
        <button class="btn" id="play">play</button>
        <button class="btn" id="next">&rarr;</button>
      </div>
    </div>
  </main>

<script type="module">
import { renderSVG } from '/src/render/render.js';
import { animateIn, seedOf } from '/src/board/draw-on.js';
import { emptyBoard, applyOps } from '/src/board/state.js';
import { lineStates, clickStep } from '/src/board/script.js';
import { createNarrator, wrapWords, wordAt } from '/src/board/narrate.js';
import { frame, unionBox, litKeys } from '/src/board/camera.js';

const $ = id => document.getElementById(id);

/* One server holds every board, each under /b/<name>/, so this page's own path
   is its api root. Taken from the location rather than from a name baked into
   the html, because the same file serves every board. The renderer above is
   imported from /src/ instead: one copy, shared by all of them. */
const API = location.pathname.replace(/[^/]*$/, '');

// which board this page is, as the server knows it — shown in the window title
let boardTag = '';
fetch(API + 'whoami').then(r => r.json()).then(w => { boardTag = w.name || ''; }).catch(() => {});
const pan = $('pan'), stage = $('stage');

let board = null;      // the live board
let shown = null;      // what is on screen — the live board, or a replay of it
let lastBoxes = {};
let lastOffset = { x: 0, y: 0 };
let lastActive;                 // the step the camera last framed
const MARGIN = 18;
const view_of = () => shown || board;
let drawn = new Set();          // keys already on the board, so they animate once
let view = { x: 0, y: 0, k: 1 };
let userMoved = false;
let playing = null;

/* ---------- drawing a new group on, stroke by stroke ---------- */

/* ---------- render ---------- */

function render(fresh = null) {
  const board = view_of();
  if (!board) return;
  const empty = !board.nodes.length;
  // during a replay an empty board is the opening frame, not an invitation
  $('blank').hidden = !empty || replaying;
  if (empty) { pan.innerHTML = ''; drawn = new Set(); return; }

  const r = renderSVG(board, { margin: MARGIN, active: board.active, hand: false });
  pan.innerHTML = r.svg;
  pan.dataset.w = r.width; pan.dataset.h = r.height;
  lastBoxes = r.boxes; lastOffset = r.offset;

  // Anything whose key is new gets drawn on; everything else is simply there.
  // Stagger order is boxes, then enclosures, then the lines between them —
  // the order a person draws in. Lines first would point at empty paper.
  const rank = { node: 0, boundary: 1, edge: 2 };
  const groups = [...pan.querySelectorAll('[data-node],[data-boundary],[data-edge]')]
    .map(g => ({ g, kind: g.dataset.node ? 'node' : g.dataset.boundary ? 'boundary' : 'edge' }))
    .sort((a, b) => rank[a.kind] - rank[b.kind]);
  // How fast the hand works depends on how much arrived. One box while someone
  // is talking gets drawn deliberately; a whole spec landing at once is laid
  // down briskly, because nobody wants to watch nine boxes drawn in sequence.
  const pending = groups.filter(({ g }) =>
    !drawn.has(g.dataset.node || g.dataset.boundary || g.dataset.edge));
  const pace = pending.length > 6 ? 0.22 : pending.length > 2 ? 0.38 : 0.6;
  let clock = 0;
  for (const { g } of pending) {
    const key = g.dataset.node || g.dataset.boundary || g.dataset.edge;
    const dur = animateIn(g, clock, seedOf(key));
    clock += Math.min(dur * pace, 480);
    drawn.add(key);
  }
  const n = pending.length;
  if (!userMoved && !replaying) fit(groups.length > 0 && n > 0);
  $('count').textContent = `${board.nodes.length} boxes · ${board.edges.length} lines`;
  return clock;
}

function fit(smooth = false) {
  const W = +pan.dataset.w || 1, H = +pan.dataset.h || 1;
  const aw = stage.clientWidth - 32, ah = stage.clientHeight - (view_of()?.flow?.length ? 86 : 32);
  // The stage can report zero size mid-layout — in a split pane that is resizing,
  // or before the first paint. Fitting to that yields a negative scale that
  // sticks, so skip and let the ResizeObserver below try again.
  if (aw < 40 || ah < 40) return;
  const k = Math.max(0.05, Math.min(1.25, aw / W, ah / H));
  view = { k, x: (stage.clientWidth - W * k) / 2, y: Math.max(12, (ah - H * k) / 2) };
  pan.style.transition = smooth ? 'transform .45s cubic-bezier(.3,.7,.3,1)' : 'none';
  applyView();
}

const applyView = () => { pan.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; };

/* ---------- transcript ---------- */

const mdish = s => s
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');

function renderRail() {
  const rail = $('rail');
  const board = view_of();
  const t = board?.transcript || [];
  if (!t.length) {
    if (!rail.querySelector('.empty')) rail.innerHTML = '<div class="empty">Nothing said yet.</div>';
    return;
  }

  /* Append-only. A step change restyles the lines that are already there and
     touches nothing else: rebuilding the rail's HTML would restart every
     line's fade-in, so pressing through 1/6 … 6/6 would make the whole script
     flicker each time. Lines only ever arrive at the end, except on a replay,
     which starts from none. */
  let nodes = [...rail.querySelectorAll('.said')];
  if (nodes.length > t.length) { rail.innerHTML = ''; nodes = []; }
  if (!nodes.length) rail.innerHTML = '';
  for (let i = nodes.length; i < t.length; i++) {
    const d = document.createElement('div');
    d.dataset.line = i;
    rail.appendChild(d);
    nodes.push(d);
  }

  // which line goes with which step, and how it should look — board/script.js
  const states = lineStates(board);

  t.forEach((e, i) => {
    const node = nodes[i], { step, state } = states[i];
    const cls = ['said'];
    if (i === t.length - 1) cls.push('latest');
    if (state !== 'idle') cls.push(state);
    // A line that names a step is a way into that step: the reader has just
    // read the words, and the hop they are about is one click away.
    if (step != null) cls.push('go');
    node.className = cls.join(' ');
    if (step == null) delete node.dataset.step; else node.dataset.step = String(step);
    node.title = step == null ? '' : `step ${step + 1} \u2014 click to walk it`;
    const tag = step == null ? '' : `<span class="tag">step ${step + 1}</span>`;
    const html = tag + `<span class="said-body">${mdish(e.text)}</span>`;
    if (node.dataset.html !== html) {
      node.innerHTML = html;
      node.dataset.html = html;
      /* Every word gets its own span, numbered by where it starts. The
         narrator speaks this element's textContent, so an offset reported by
         the synthesiser maps straight onto one of these. */
      wrapWords(node.querySelector('.said-body'));
    }
  });

  loadTape();

  /* Follow the step, not the tail: while a step is lit, its own lines are what
     the reader needs on screen, and in a long session they are far above the
     bottom. With no step, the newest line is the interesting one. */
  const lit = rail.querySelector('.said.on');
  if (lit) {
    const top = lit.offsetTop - rail.clientHeight / 2 + lit.offsetHeight / 2;
    rail.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  } else {
    rail.scrollTop = rail.scrollHeight;
  }
}

/* ---------- flow ---------- */

function renderSteps() {
  const board = view_of();
  const f = board?.flow || [];
  $('steps').hidden = !f.length;
  if (!f.length) return;
  const i = board.active;
  $('stepn').textContent = i == null ? `${f.length} steps` : `${i + 1}/${f.length}`;
  $('steptxt').textContent = i == null ? 'press → to walk the flow' : (f[i].step || f[i].edge || '');
  $('prev').disabled = i == null || i <= 0;
  $('next').disabled = i != null && i >= f.length - 1;
}

const focus = step => post([{ op: 'focus', step }]);

/* ---------- following the step ----------

   Walking the flow dims everything that is not part of the step. On a board
   wider than the pane that is the wrong way round: the step you asked for can
   be off screen, and all you see is the part you were not asking about going
   grey. So the camera brings the lit boxes into view.

   It is a toggle because the other reading is just as reasonable — someone
   zoomed into one corner on purpose does not want the view yanked away by a
   step they pressed to read the script, not to move the picture. The rule for
   when it stays put lives in board/camera.js, where it can be tested.

   Remembered across reloads: a board is reloaded often enough (a restarted
   server, a reopened pane) that re-asserting a preference every time would
   make it feel like it never took. */
let following = true;
try { following = localStorage.getItem('spiega.follow') !== 'off'; } catch { /* private window */ }

/* What a reader can actually see: the stage, less the steps bar that floats
   over the bottom of it. Framing to the full stage would park the subject
   underneath the bar on a short pane. */
function visibleArea() {
  const bar = $('steps');
  const inset = bar.hidden ? 0 : bar.offsetHeight;
  return { x0: 0, y0: 0, x1: stage.clientWidth, y1: stage.clientHeight - inset };
}

function frameStep() {
  if (!following || replaying) return;
  const b = view_of();
  if (b?.active == null) return;
  const next = frame({
    subject: unionBox(lastBoxes, litKeys(b.flow?.[b.active])),
    canvas: { w: +pan.dataset.w || 1, h: +pan.dataset.h || 1 },
    view, visible: visibleArea(), offset: lastOffset,
  });
  if (!next) return;              // already in view, or the whole board is
  view = next;
  // the camera is placed now, so a box arriving later must not snap it back
  userMoved = true;
  pan.style.transition = 'transform .5s cubic-bezier(.33,.7,.3,1)';
  applyView();
}

$('follow').classList.toggle('on', following);
$('follow').onclick = () => {
  following = !following;
  $('follow').classList.toggle('on', following);
  try { localStorage.setItem('spiega.follow', following ? 'on' : 'off'); } catch { /* private window */ }
  if (following) frameStep();     // show what it does, rather than describing it
};

/* ---------- the tape ----------

   Each line of the script is a section. Playing one reads it aloud, lights
   the word being spoken, and — when the line is tagged with a step — walks
   the board to that step as the line begins, so the picture moves with the
   words instead of after them.

   Modelled on effect.institute: space plays and pauses, a click starts from
   the line you clicked, and the tape runs on by itself. */
const narrator = createNarrator({
  onState: ({ playing, index }) => {
    const b = $('narrate');
    b.classList.toggle('on', playing);
    b.textContent = playing ? 'pause' : 'narrate';
    const rail = $('rail');
    rail.querySelectorAll('.said.saying').forEach(n => n.classList.remove('saying'));
    const row = rail.querySelector(`.said[data-line="${index}"]`);
    if (row) {
      row.classList.add('saying');
      const top = row.offsetTop - rail.clientHeight / 2 + row.offsetHeight / 2;
      rail.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }
  },
});

/* Hand the narrator the current script. Rebuilt whenever the rail is, which
   is cheap: the sections hold references to the rows, not copies of them. */
function loadTape() {
  const b = view_of();
  const t = b?.transcript || [];
  const states = lineStates(b);
  narrator.load(t.map((e, i) => {
    const row = $('rail').querySelector(`.said[data-line="${i}"]`);
    const body = row?.querySelector('.said-body');
    const words = body ? [...body.querySelectorAll('.w')] : [];
    return {
      text: body ? body.textContent : e.text,
      step: states[i].step,
      onStart() {
        words.forEach(w => w.classList.remove('lit'));
        // the board goes where the words are
        if (states[i].step != null && view_of()?.active !== states[i].step) focus(states[i].step);
      },
      onWord(at) {
        const k = wordAt(words.map(w => +w.dataset.at), at);
        const best = k < 0 ? null : words[k];
        if (!best || best.classList.contains('lit')) return;
        words.forEach(w => w.classList.remove('lit'));
        best.classList.add('lit');
      },
      onDone() { words.forEach(w => w.classList.remove('lit')); },
    };
  }));
}

/* The voice list arrives late in Chrome — getVoices() is empty on the first
   call and fills in on `voiceschanged` — so this runs again when it does. */
function fillVoices() {
  const sel = $('voicepick');
  const all = narrator.voices();
  if (!all.length) { sel.hidden = true; return; }
  const current = narrator.voiceName;
  if (sel.dataset.filled === String(all.length) && sel.value === current) return;
  sel.innerHTML = all.map(v =>
    `<option value="${v.name}"${v.name === current ? ' selected' : ''}>` +
    `${v.name}${v.local ? '' : ' · online'}</option>`).join('');
  sel.dataset.filled = String(all.length);
  sel.hidden = false;
}
if (typeof speechSynthesis !== 'undefined') {
  fillVoices();
  speechSynthesis.addEventListener?.('voiceschanged', fillVoices);
} else {
  $('voicepick').hidden = true;
}

$('voicepick').onchange = e => {
  narrator.setVoice(e.target.value);
  narrator.sample();          // hear it immediately, which is how you choose
};

$('narrate').onclick = () => {
  if (!narrator.available) { $('narrate').textContent = 'no voice'; return; }
  narrator.toggle();
};

/* Click a line of the script to walk the step it explains.

   One delegated listener rather than one per line, because the rail is
   append-only and rebinding on every state change would leak handlers. A
   second click on the step already lit clears it, so the same gesture gets you
   out — and a replay owns the screen while it runs, so clicks are ignored
   until it ends. */
$('rail').addEventListener('click', e => {
  if (replaying) return;
  const row = e.target.closest?.('.said');
  if (!row) return;
  /* A click starts the tape at that line — "advance the tape", rather than
     "select an item". The step follows from the line, as it does when the
     tape reaches it by itself. */
  if (narrator.available && narrator.playing) return narrator.play(Number(row.dataset.line));
  const want = clickStep(view_of(), Number(row.dataset.step));
  if (want !== undefined) focus(want);
});
$('prev').onclick = () => focus(Math.max(0, (board.active ?? 0) - 1));
$('next').onclick = () => focus(board.active == null ? 0 : Math.min(board.flow.length - 1, board.active + 1));
/* Play walks the flow on a timer. Starting and stopping are two named
   functions, not one toggle that re-enters itself: the earlier version ended
   the run by clicking its own button, which fired before `playing` had been
   assigned, so a play pressed on the last step recursed until the stack gave
   out — and left the button stuck reading "stop", refusing every later press. */
function stopPlay() {
  if (playing) clearInterval(playing);
  playing = null;
  $('play').classList.remove('on');
  $('play').textContent = 'play';
}

function startPlay() {
  const f = board?.flow || [];
  if (!f.length) return;
  // pressing play while parked on the last step means start again, not stop
  let i = board.active == null || board.active >= f.length - 1 ? -1 : board.active;
  $('play').classList.add('on');
  $('play').textContent = 'stop';
  const tick = () => {
    if (++i >= (board?.flow?.length || 0)) return stopPlay();
    focus(i);
  };
  playing = setInterval(tick, 1600);   // assigned before the first tick, so stop can always find it
  tick();
}

$('play').onclick = () => (playing ? stopPlay() : startPlay());

/* ---------- replay: the session, as it happened ---------- */

/* A finished board shows the answer but not the thinking, and on anything
   complex the answer alone is a wall. Replay puts the session back: the line
   that was said, then the thing it was about being drawn, in the order it
   happened — and the camera goes where the work is, because a fifteen-box
   board shrunk to fit is a diagram again, not a explanation.

   Wall-clock gaps are thrown away. An agent may have thought for a minute
   between two boxes; nobody wants to watch that. Pacing comes from how much
   there is to read, not from how long it originally took. */

let replaying = false;
let gen = 0;            // bumped on every start and stop, so a loop suspended in
                        // an await can tell that the run it belongs to is over —
                        // the flag alone is not enough: stop, then start again,
                        // and the old loop wakes to find `replaying` true and
                        // carries on alongside the new one.
const beat = ms => new Promise(r => setTimeout(r, ms));

/* Ease the camera onto whatever was just drawn — but only when there is a
   reason to move. A board that already fits gets a held wide shot: a camera
   that cuts around content you can see anyway is just motion sickness. And the
   view never pans past the board's own edges, or the subject ends up framed
   against empty paper. */
function panTo(key) {
  const W = +pan.dataset.w || 1, H = +pan.dataset.h || 1;
  const aw = stage.clientWidth - 32, ah = stage.clientHeight - 96;
  if (aw < 60 || ah < 60) return;

  const fitK = Math.min(1.15, aw / W, ah / H);
  if (fitK >= 0.72) { userMoved = false; fit(true); return; }   // it all fits: hold

  const b = lastBoxes[key] || (() => {
    const [from, to] = String(key).split('>');          // an edge: frame both ends
    const p = lastBoxes[from], q = lastBoxes[to];
    if (!p || !q) return null;
    const x = Math.min(p.x, q.x), y = Math.min(p.y, q.y);
    return { x, y, w: Math.max(p.x + p.w, q.x + q.w) - x, h: Math.max(p.y + p.h, q.y + q.h) - y };
  })();
  if (!b) return;

  // close enough to read, with room around it: context is what makes a box
  // read as part of a system rather than as a box
  const k = Math.max(fitK, Math.min(0.95, aw / (b.w * 2.4), ah / (b.h * 3.2)));
  const cx = (b.x + b.w / 2 + MARGIN) * k, cy = (b.y + b.h / 2 + MARGIN) * k;
  const span = (total, avail, centre) => total * k <= avail
    ? (avail - total * k) / 2 + 16                      // fits on this axis: centre it
    : Math.min(16, Math.max(avail - total * k + 16, avail / 2 - centre));

  view = { k, x: span(W, stage.clientWidth, cx), y: span(H, stage.clientHeight - 60, cy) };
  pan.style.transition = 'transform .75s cubic-bezier(.33,.7,.3,1)';
  applyView();
}

/* Put a line on screen, or clear it. */
function say(text) {
  const c = $('caption');
  if (!text) { c.classList.remove('on'); setTimeout(() => { if (!c.classList.contains('on')) c.hidden = true; }, 320); return; }
  c.innerHTML = mdish(text);
  c.hidden = false;
  requestAnimationFrame(() => c.classList.add('on'));
}

function stopReplay() {
  replaying = false;
  gen++;
  say(null);
  shown = null;
  drawn = new Set();
  $('replay').classList.remove('on');
  $('replay').textContent = 'replay';
  render(); renderRail(); renderSteps();
  userMoved = false; fit(true);
}

async function replay() {
  if (replaying) return stopReplay();
  const log = (board?.log || []).filter(e => e.op !== 'focus' && e.op !== 'clear');
  if (!log.length) return;

  const mine = ++gen;
  const live = () => replaying && gen === mine;
  replaying = true;
  userMoved = false;
  $('replay').classList.add('on');
  $('replay').textContent = 'stop';

  const rb = emptyBoard();
  shown = rb;
  drawn = new Set();
  render(); renderRail(); renderSteps();
  await beat(400);

  if (!live()) return;
  for (const entry of log) {
    if (!live()) return;
    const before = new Set(drawn);
    applyOps(rb, [entry]);

    if (entry.op === 'say') {
      renderRail();
      say(entry.text);
      // time to read it, floored so a short line still lands
      await beat(Math.min(4200, 850 + (entry.text || '').length * 26));
      continue;   // the loop head re-checks live()
    }
    if (entry.op === 'title') { $('title').textContent = rb.title; continue; }

    const drawMs = render() || 400;
    renderSteps();
    // frame whatever is new, once it has somewhere to be
    const added = [...drawn].find(k => !before.has(k));
    if (added) { await beat(90); if (!live()) return; panTo(added); }
    await beat(Math.max(520, drawMs + 260));
  }

  if (!live()) return;
  // the closing wide shot
  userMoved = false;
  fit(true);
  await beat(1100);
  if (!live()) return;
  stopReplay();
}

$('replay').onclick = replay;

/* ---------- plumbing ---------- */

async function post(ops) {
  await fetch(API + 'op', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ops }) });
}

function onState(b, fresh) {
  const first = !board;
  board = b;
  // A replay owns the screen while it runs; the live board keeps updating
  // underneath and is shown again when the replay ends.
  if (replaying) { $('count').textContent = 'replaying\u2026'; return; }
  $('title').textContent = b.title || 'spiega';
  // The board name goes in the window title because that is the only handle an
  // OS has on a browser app window: `spiega focus` finds the window by it.
  document.title = (b.title ? `${b.title} · spiega` : 'spiega') + (boardTag ? ` [${boardTag}]` : '');
  setLink('live');
  clearTimeout(onState._t);
  onState._t = setTimeout(() => setLink(es && es.readyState === EventSource.OPEN ? 'idle' : 'down'), 2500);
  renderRail();
  render(fresh);
  renderSteps();
  if (first) userMoved = false;
  // A step change is the only thing the camera follows, and it arrives here
  // however it was asked for: the arrows, a click in the rail, play, or the
  // narrator reaching a line that is tagged with it.
  if (b.active !== lastActive) { lastActive = b.active; frameStep(); }
}

/* The stream is the only thing keeping this page true. If it dies — the server
   restarted, the machine slept, the network blinked — a board that silently
   keeps showing its last state is worse than no board, because it looks like an
   answer. So: reconnect with backoff, say so in the bar while disconnected, and
   re-sync whenever the window is looked at again. */
let es = null, retry = 0, retryTimer = null;

function setLink(state) {           // 'live' | 'idle' | 'down'
  const dot = $('live');
  dot.classList.toggle('idle', state === 'idle');
  dot.classList.toggle('down', state === 'down');
  dot.title = state === 'down' ? 'not connected to the board server'
    : state === 'live' ? 'the agent just drew something' : 'connected, waiting';
  $('offline').hidden = state !== 'down';
}

/* A board nobody is writing down looks exactly like one that is, so it has to
   say so itself. The CLI cannot: by the time anyone notices, the explanation is
   already gone. */
function setSaving(s) {
  const why = s && s.saving === false && s.why !== 'memory' ? s.why : null;
  $('unsaved').hidden = !why;
  if (!why) return;
  $('unsavedwhy').textContent = why === 'other-server'
    ? 'another spiega owns this board\u2019s file \u2014 nothing drawn here will survive a restart'
    : 'this board\u2019s file could not be opened \u2014 nothing drawn here will survive a restart';
}

function connect() {
  clearTimeout(retryTimer);
  if (es) { try { es.close(); } catch {} }
  es = new EventSource(API + 'events');

  es.addEventListener('open', () => { retry = 0; setLink('idle'); });
  es.addEventListener('state', e => {
    // A full state means we may be looking at a different board than before,
    // so forget what we thought was already drawn.
    drawn = new Set();
    onState(JSON.parse(e.data));
  });
  es.addEventListener('patch', e => { const d = JSON.parse(e.data); onState(d.board, d.fresh); });
  es.addEventListener('saving', e => setSaving(JSON.parse(e.data)));
  // `spiega replay` — or the agent's own tool — asking for the movie again.
  // Always a start, never a toggle: a remote caller cannot see the button.
  es.addEventListener('replay', () => { if (replaying) stopReplay(); replay(); });
  es.addEventListener('error', () => {
    if (es.readyState === EventSource.CLOSED || es.readyState === EventSource.CONNECTING) {
      setLink('down');
      // EventSource retries on its own, but not after the server refuses the
      // connection outright, which is the case that actually bites here.
      retry = Math.min(retry + 1, 6);
      retryTimer = setTimeout(connect, Math.min(800 * retry, 5000));
    }
  });
}
connect();

/* Coming back to the window is the moment a stale board is most misleading. */
addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!es || es.readyState !== EventSource.OPEN) connect();
  else fetch(API + 'state').then(r => r.json()).then(b => { if (b.rev !== board?.rev) onState(b); }).catch(() => {});
});

/* ---------- pan, zoom, keys ---------- */

stage.addEventListener('wheel', e => {
  e.preventDefault();
  userMoved = true;
  pan.style.transition = 'none';
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.max(0.2, Math.min(3, view.k * (1 - e.deltaY * 0.0016)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  applyView();
}, { passive: false });

let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.steps')) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  stage.classList.add('drag'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  userMoved = true; pan.style.transition = 'none';
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  applyView();
});
const endDrag = () => { drag = null; stage.classList.remove('drag'); };
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('dblclick', () => { userMoved = false; fit(true); });

$('fit').onclick = () => { userMoved = false; fit(true); };
$('snap').onclick = () => window.open(API + 'snapshot', '_blank');
$('rail-toggle').onclick = e => {
  $('main').classList.toggle('norail');
  e.target.classList.toggle('on', !$('main').classList.contains('norail'));
  setTimeout(() => { if (!userMoved) fit(true); }, 60);
};
if (matchMedia('(max-width:820px)').matches) $('main').classList.add('norail');
$('rail-toggle').classList.toggle('on', !$('main').classList.contains('norail'));

/* Zoom in steps, about the centre of the stage. Continuous wheel zoom repaints
   every frame, which is fine in a browser window and miserable in a terminal
   pane, where each frame has to be encoded and pushed through the TTY. One
   keypress, one repaint. */
function zoomBy(factor) {
  userMoved = true;
  const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
  const k = Math.max(0.2, Math.min(3, view.k * factor));
  view.x = cx - (cx - view.x) * (k / view.k);
  view.y = cy - (cy - view.y) * (k / view.k);
  view.k = k;
  pan.style.transition = 'transform .18s ease-out';
  applyView();
}

addEventListener('keydown', e => {
  /* The tape owns the transport keys while it exists. Space plays and pauses,
     the up and down arrows move between lines, R restarts the current one —
     the arrangement effect.institute uses, which reads as a player rather
     than as a stepper. Left and right keep their meaning here: they walk the
     flow, which is the board's own axis and not the tape's. */
  if (narrator.available) {
    if (e.key === ' ') { e.preventDefault(); return narrator.toggle(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); return narrator.next(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); return narrator.prev(); }
    if (e.key === 'r' && narrator.playing) { e.preventDefault(); return narrator.restart(); }
    if (e.key === '[') { e.preventDefault(); return narrator.setRate(narrator.rate - 0.1); }
    if (e.key === ']') { e.preventDefault(); return narrator.setRate(narrator.rate + 0.1); }
  }
  if (e.key === '+' || e.key === '=') return zoomBy(1.25);
  if (e.key === '-' || e.key === '_') return zoomBy(1 / 1.25);
  if (e.key === '0') { userMoved = false; return fit(true); }
  if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();

  else if (e.key === 'f') $('fit').click();
  else if (e.key === 'r') $('replay').click();
  else if (e.key === 'Escape') { if (replaying) stopReplay(); else focus(null); }
});
addEventListener('resize', () => { if (!userMoved) fit(); });
// A board usually lives in a pane someone is dragging wider or narrower.
new ResizeObserver(() => { if (!userMoved) fit(); }).observe(stage);
</script>
</body>
</html>
