<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="handwave">
  <title>handwave</title>
  <defs>
    <filter id="hand" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="5" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.5" xChannelSelector="R" yChannelSelector="G" result="wob"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n1"/>
      <feColorMatrix in="n1" type="matrix" values=".16 0 0 0 .91  .16 0 0 0 .91  .16 0 0 0 .91  0 0 0 0 1" result="grain"/>
      <feBlend in="wob" in2="grain" mode="multiply"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="#f2efe7"/>

  <g filter="url(#hand)" stroke-linecap="round" stroke-linejoin="round" stroke="#231e16">

    <!-- board -->
    <rect x="48" y="36" width="416" height="292" rx="28"
          fill="#f8f6f0" stroke-width="14"/>

    <!-- diagram -->
    <rect x="92" y="118" width="100" height="74" rx="14"
          fill="#76a0e2" stroke-width="8"/>
    <rect x="296" y="118" width="100" height="74" rx="14"
          fill="#93d3b0" stroke-width="8"/>
    <path d="M202 155 h80" fill="none" stroke-width="8"/>
    <path d="M266 141 l24 14 -24 14" fill="none" stroke-width="8"/>

    <!-- title accent -->
    <circle cx="96" cy="78" r="10" fill="#ef6a4c" stroke-width="0"/>
    <path d="M118 78 C154 64, 184 92, 220 78 S286 64, 322 78"
          fill="none" stroke="#ef6a4c" stroke-width="8"/>

    <!--
      Side-view writing hand (reads instantly):
      wrist at bottom-right, fingers curl left around a marker,
      tip touches the board near the green box.
    -->
    <g transform="translate(250,250)">

      <!-- marker: tip up-left onto board, barrel through the fist -->
      <g transform="translate(30,10) rotate(-40)">
        <rect x="0" y="20" width="28" height="150" rx="7"
              fill="#ef6a4c" stroke-width="9"/>
        <rect x="-2" y="130" width="32" height="18" rx="4"
              fill="#cf5038" stroke-width="6"/>
        <path d="M2 20 L14 -18 L26 20 Z" fill="#231e16" stroke-width="0"/>
      </g>

      <!-- forearm -->
      <path d="M110 120
               C105 165, 120 220, 160 255
               L230 220
               C200 170, 175 130, 155 100 Z"
            fill="#f3a6bb" stroke-width="10"/>

      <!-- fist / palm block -->
      <path d="M55 55
               C40 70, 38 110, 55 135
               C72 158, 120 165, 155 148
               C180 136, 190 100, 175 72
               C160 45, 110 35, 75 40
               C65 42, 58 48, 55 55 Z"
            fill="#f3a6bb" stroke-width="10"/>

      <!-- thumb on the near side of the marker -->
      <path d="M60 85
               C35 80, 15 55, 25 32
               C32 16, 58 18, 70 35
               C80 50, 82 72, 72 88
               C68 94, 62 92, 60 85 Z"
            fill="#f3a6bb" stroke-width="9"/>

      <!-- four fingers as one stacked curl over the marker (side view classic) -->
      <!-- index (top / longest toward tip) -->
      <path d="M95 40
               C90 5, 105 -25, 135 -30
               C155 -34, 170 -15, 162 10
               C155 30, 135 48, 115 58 Z"
            fill="#f3a6bb" stroke-width="9"/>
      <!-- middle -->
      <path d="M118 55
               C120 25, 135 0, 160 -5
               C178 -8, 192 12, 182 35
               C174 55, 150 72, 130 80 Z"
            fill="#f3a6bb" stroke-width="9"/>
      <!-- ring -->
      <path d="M135 80
               C145 58, 165 50, 182 60
               C196 68, 198 90, 182 100
               C165 110, 142 100, 135 80 Z"
            fill="#f3a6bb" stroke-width="8"/>
      <!-- pinky -->
      <path d="M140 108
               C150 95, 170 95, 180 108
               C188 118, 184 135, 168 138
               C152 142, 138 125, 140 108 Z"
            fill="#f3a6bb" stroke-width="8"/>

      <!-- redraw marker tip + shaft above fingers so the pen reads clearly -->
      <g transform="translate(30,10) rotate(-40)">
        <rect x="0" y="8" width="28" height="40" rx="6"
              fill="#ef6a4c" stroke-width="9"/>
        <path d="M2 20 L14 -18 L26 20 Z" fill="#231e16" stroke-width="0"/>
      </g>

    </g>
  </g>
</svg>
