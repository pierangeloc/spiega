<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="handwave">
  <title>handwave</title>
  <defs>
    <filter id="hand" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-8%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#1c2948"/>

  <g filter="url(#cardShadow)">
    <rect x="78" y="108" width="356" height="296" rx="28" fill="#f2efe7" stroke="#f8f6f0" stroke-width="8"/>
  </g>

  <g filter="url(#hand)" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(118,210)">
      <rect x="0" y="0" width="72" height="48" rx="8" fill="#f8f6f0" stroke="#231e16" stroke-width="5"/>
      <path d="M36 48 v14" stroke="#231e16" stroke-width="5" fill="none"/>
      <path d="M22 62 h28" stroke="#231e16" stroke-width="5" fill="none"/>
    </g>

    <g transform="translate(220,198)">
      <rect x="0" y="0" width="88" height="60" rx="10" fill="#76a0e2" stroke="#231e16" stroke-width="5"/>
    </g>

    <g transform="translate(348,196)">
      <ellipse cx="34" cy="14" rx="34" ry="12" fill="#71b693" stroke="#231e16" stroke-width="5"/>
      <path d="M0 14 v48 a34 12 0 0 0 68 0 v-48" fill="#93d3b0" stroke="#231e16" stroke-width="5"/>
      <ellipse cx="34" cy="14" rx="34" ry="12" fill="#93d3b0" stroke="#231e16" stroke-width="5"/>
    </g>

    <path d="M192 234 C204 234, 208 228, 218 228" fill="none" stroke="#231e16" stroke-width="4.5"/>
    <path d="M210 221 l10 7 -10 7" fill="none" stroke="#231e16" stroke-width="4.5"/>
    <path d="M310 228 C322 228, 328 228, 346 228" fill="none" stroke="#231e16" stroke-width="4.5"/>
    <path d="M336 221 l12 7 -12 7" fill="none" stroke="#231e16" stroke-width="4.5"/>

    <path d="M264 262 C264 290, 300 300, 348 278" fill="none" stroke="#ef6a4c" stroke-width="5.5"/>
    <path d="M338 270 l12 6 -4 12" fill="none" stroke="#ef6a4c" stroke-width="5"/>
    <circle cx="300" cy="292" r="13" fill="#ef6a4c" stroke="#231e16" stroke-width="3.5"/>
    <text x="300" y="297" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace"
          font-size="14" font-weight="700" fill="#f8f6f0">3</text>

    <path d="M128 150 C148 138, 168 162, 188 150 S228 138, 248 150 S288 162, 308 150 S348 138, 368 150"
          fill="none" stroke="#ef6a4c" stroke-width="6"/>
  </g>

  <circle cx="112" cy="148" r="7" fill="#ef6a4c"/>
</svg>
