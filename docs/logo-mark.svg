<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="spiega">
  <title>spiega</title>
  <defs>
    <filter id="hand" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#f2efe7"/>

  <g filter="url(#hand)" stroke-linecap="round" stroke-linejoin="round">
    <!-- mini board -->
    <rect x="18" y="28" width="92" height="72" rx="10" fill="#f8f6f0" stroke="#231e16" stroke-width="5"/>

    <!-- three boxes -->
    <rect x="28" y="52" width="20" height="16" rx="3" fill="#f8f6f0" stroke="#231e16" stroke-width="3"/>
    <rect x="54" y="50" width="22" height="18" rx="4" fill="#76a0e2" stroke="#231e16" stroke-width="3"/>
    <ellipse cx="94" cy="54" rx="10" ry="4" fill="#93d3b0" stroke="#231e16" stroke-width="3"/>
    <path d="M84 54 v14 a10 4 0 0 0 20 0 v-14" fill="#93d3b0" stroke="#231e16" stroke-width="3"/>
    <ellipse cx="94" cy="54" rx="10" ry="4" fill="#93d3b0" stroke="#231e16" stroke-width="3"/>

    <!-- arrows -->
    <path d="M49 60 h4" stroke="#231e16" stroke-width="2.5" fill="none"/>
    <path d="M77 60 h5" stroke="#231e16" stroke-width="2.5" fill="none"/>

    <!-- accent wave + hop -->
    <path d="M30 40 C40 34, 48 46, 58 40 S78 34, 88 40" fill="none" stroke="#ef6a4c" stroke-width="3.5"/>
    <path d="M65 70 C65 82, 78 86, 90 78" fill="none" stroke="#ef6a4c" stroke-width="3.5"/>
  </g>

  <circle cx="30" cy="40" r="3.5" fill="#ef6a4c"/>
</svg>
