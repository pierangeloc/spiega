<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="handwave">
  <title>handwave</title>
  <defs>
    <filter id="hand" x="-6%" y="-20%" width="112%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.8" xChannelSelector="R" yChannelSelector="G" result="wob"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" result="n1"/>
      <feColorMatrix in="n1" type="matrix" values=".3 0 0 0 .88  .3 0 0 0 .88  .3 0 0 0 .88  0 0 0 0 1" result="grain"/>
      <feBlend in="wob" in2="grain" mode="multiply"/>
    </filter>
  </defs>

  <!-- transparent ground so it drops on any page -->
  <rect width="720" height="200" fill="none"/>

  <!-- mark -->
  <g filter="url(#hand)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="36" width="128" height="128" rx="28" fill="#f2efe7" stroke="#231e16" stroke-width="6"/>
    <rect x="34" y="58" width="92" height="72" rx="12" fill="#f8f6f0" stroke="#231e16" stroke-width="5"/>

    <rect x="44" y="82" width="20" height="16" rx="3" fill="#f8f6f0" stroke="#231e16" stroke-width="3"/>
    <rect x="70" y="80" width="22" height="18" rx="4" fill="#76a0e2" stroke="#231e16" stroke-width="3"/>
    <ellipse cx="110" cy="84" rx="10" ry="4" fill="#93d3b0" stroke="#231e16" stroke-width="3"/>
    <path d="M100 84 v14 a10 4 0 0 0 20 0 v-14" fill="#93d3b0" stroke="#231e16" stroke-width="3"/>
    <ellipse cx="110" cy="84" rx="10" ry="4" fill="#93d3b0" stroke="#231e16" stroke-width="3"/>

    <path d="M65 90 h4" stroke="#231e16" stroke-width="2.5"/>
    <path d="M93 90 h5" stroke="#231e16" stroke-width="2.5"/>
    <path d="M46 70 C56 64, 64 76, 74 70 S94 64, 104 70" fill="none" stroke="#ef6a4c" stroke-width="3.5"/>
    <path d="M81 100 C81 112, 94 116, 106 108" fill="none" stroke="#ef6a4c" stroke-width="3.5"/>
    <circle cx="46" cy="70" r="3.5" fill="#ef6a4c"/>
  </g>

  <!-- wordmark -->
  <text x="172" y="122"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="72" font-weight="700" letter-spacing="-1.5"
        fill="#231e16">handwave</text>

  <!-- underline wave in accent -->
  <path d="M176 138 C210 128, 250 148, 290 138 S370 128, 410 138 S490 148, 530 138 S610 128, 650 138"
        fill="none" stroke="#ef6a4c" stroke-width="5" stroke-linecap="round"
        filter="url(#hand)"/>
</svg>
